<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивный тренажёр скорочтения для учеников 1–4 классов">
<title>Читай и догоняй! — тренажёр скорочтения</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;subset=cyrillic&amp;display=swap" rel="stylesheet">
<style>
:root{
  --hl:#ffb703; --hl-text:#1d3557; --ink:#1d3557; --muted:#8a97b0; --done:#6b7a99;
  --blue:#3a86ff; --blue-d:#2160c4; --green:#2ec27e; --green-d:#1e8c59; --orange:#ff8c42; --orange-d:#d9661e;
  --red:#ef476f; --red-d:#b8304f; --purple:#8e5cf7; --purple-d:#6236c4; --yellow:#ffd23f; --yellow-d:#d9a800;
  --card:#ffffff; --panel:rgba(255,255,255,.92); --radius:1.2rem; --fs:1;
  --font:"Nunito","Segoe UI","Trebuchet MS","Helvetica Neue",Arial,sans-serif;
  --read-font:"Nunito","Segoe UI","Trebuchet MS",Arial,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:max(12px,min(1.15vw,2.05vh));-webkit-text-size-adjust:100%}
@media (max-aspect-ratio:1/1){html{font-size:max(12px,min(3.6vw,2vh))}}
body{font-family:var(--font);color:var(--ink);background:#bde0fe;height:100vh;height:100dvh;overflow:hidden;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:1rem;color:inherit}
input,textarea,select{user-select:text;-webkit-user-select:text}
#app{position:relative;width:100%;height:100%;overflow:hidden}

/* ---------- backgrounds ---------- */
.bg-sky{background:linear-gradient(180deg,#a9def9 0%,#e4f6ff 55%,#c7f0bd 100%)}
.bg-meadow{background:linear-gradient(180deg,#d8f3dc 0%,#b7e4c7 60%,#95d5b2 100%)}
.bg-sunny{background:linear-gradient(160deg,#fff3b0 0%,#ffd6a5 60%,#ffadad 100%)}
.bg-candy{background:linear-gradient(160deg,#f1e4ff 0%,#ffd6f0 50%,#cde7ff 100%)}
.bg-plain{background:#f7fbff}
.bg-race{background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.7)),var(--img-finish) center/cover no-repeat}
.bg-book{background:radial-gradient(circle at 20% 10%,#fff8e8,#f3e2c3 70%,#e9d3ab)}
.bg-calm{background:linear-gradient(180deg,#f0f7ff 0%,#f9fbf2 100%)}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:scale(.985);
  transition:opacity .35s ease,transform .35s ease}
.screen.active{opacity:1;pointer-events:auto;transform:none}
.topbar{display:flex;align-items:center;gap:.8rem;padding:.7rem 1.2rem;flex:0 0 auto;min-height:4.2rem;flex-wrap:wrap}
.topbar h2{font-size:1.7rem;font-weight:900;letter-spacing:.02em;text-shadow:0 .12rem 0 #fff,0 .2rem .4rem rgba(0,0,0,.12);margin-right:auto;white-space:nowrap}
.stage{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:0 1.2rem}
.controls{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.45rem;padding:.7rem 1rem .9rem;
  background:rgba(255,255,255,.75);backdrop-filter:blur(6px);box-shadow:0 -.2rem .8rem rgba(0,0,0,.06)}
.paused *, .paused *::after, .paused *::before{animation-play-state:paused!important}

/* ---------- 3D buttons ---------- */
.btn{--c:var(--blue);--cd:var(--blue-d);border:0;cursor:pointer;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 55%),var(--c);
  color:#fff;font-weight:800;font-size:1.05rem;padding:.65rem 1.2rem;border-radius:1rem;box-shadow:0 .3rem 0 var(--cd),0 .45rem .8rem rgba(0,0,0,.15);
  text-shadow:0 .08rem 0 rgba(0,0,0,.2);transition:transform .08s,box-shadow .08s,filter .2s;white-space:nowrap;line-height:1.2;min-height:2.9rem;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(.25rem);box-shadow:0 .05rem 0 var(--cd),0 .2rem .4rem rgba(0,0,0,.15)}
.btn:disabled{filter:grayscale(.7) opacity(.55);cursor:default}
.btn.green{--c:var(--green);--cd:var(--green-d)} .btn.orange{--c:var(--orange);--cd:var(--orange-d)}
.btn.red{--c:var(--red);--cd:var(--red-d)} .btn.purple{--c:var(--purple);--cd:var(--purple-d)}
.btn.yellow{--c:var(--yellow);--cd:var(--yellow-d);color:#5a3b00;text-shadow:none}
.btn.white{--c:#fff;--cd:#c9d6ea;color:var(--ink);text-shadow:none}
.btn.small{font-size:.9rem;padding:.4rem .8rem;min-height:2.3rem;border-radius:.8rem}
.btn.big{font-size:1.4rem;padding:.9rem 2rem;min-height:3.6rem}
.btn.round{width:2.9rem;padding:0}

/* ---------- speed widget ---------- */
.speed{display:flex;align-items:center;gap:.35rem;background:#fff;border-radius:1rem;padding:.3rem .5rem;box-shadow:inset 0 0 0 .15rem #dbe7f7}
.speed .lbl{font-weight:800;font-size:.85rem;color:var(--muted);padding:0 .3rem;line-height:1.1;text-align:center}
.speed input{width:4.6rem;text-align:center;font-weight:900;font-size:1.35rem;border:0;background:#f1f6fd;border-radius:.6rem;padding:.25rem;color:var(--ink)}
.speed select{border:0;background:#f1f6fd;border-radius:.6rem;padding:.4rem;font-weight:700}
.info-chip{background:#fff;border-radius:1rem;padding:.45rem .9rem;font-weight:800;box-shadow:0 .15rem .5rem rgba(0,0,0,.08);white-space:nowrap}
.info-chip b{color:var(--blue)}

/* ---------- panels & forms ---------- */
.panel{background:var(--panel);border-radius:var(--radius);box-shadow:0 .4rem 1.4rem rgba(29,53,87,.12);padding:1rem 1.2rem}
.opts{display:flex;flex-wrap:wrap;gap:.8rem 1.4rem;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:.3rem;font-weight:800;font-size:.9rem;color:#4a5a7a}
.field select,.field input[type=number],.field input[type=text],.field textarea{border:.15rem solid #dbe7f7;border-radius:.7rem;padding:.45rem .6rem;background:#fff;font-weight:700;font-size:1rem;color:var(--ink);min-width:7rem}
.field textarea{min-height:8rem;resize:vertical;font-family:var(--read-font);line-height:1.5}
.check{display:flex;align-items:center;gap:.45rem;font-weight:800;font-size:.95rem;cursor:pointer;color:#4a5a7a}
.check input{width:1.3rem;height:1.3rem;accent-color:var(--green)}
input[type=color]{width:3rem;height:2.3rem;border:0;background:none;cursor:pointer}
input[type=range]{accent-color:var(--blue);width:9rem}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{border:0;cursor:pointer;min-width:2.6rem;height:2.6rem;padding:0 .6rem;border-radius:.7rem;font-weight:900;font-size:1.15rem;background:#eef4fc;color:#7a8bab;
  box-shadow:0 .2rem 0 #cfdbec;transition:.1s}
.chip.on{background:var(--green);color:#fff;box-shadow:0 .2rem 0 var(--green-d)}
.chip.vow.on{background:var(--red);box-shadow:0 .2rem 0 var(--red-d)}
.seg{display:inline-flex;background:#eef4fc;border-radius:.9rem;padding:.2rem;gap:.2rem;flex-wrap:wrap}
.seg button{border:0;background:none;padding:.45rem .8rem;border-radius:.7rem;font-weight:800;cursor:pointer;color:#5b6c8c}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 .15rem .4rem rgba(0,0,0,.12)}
.setup{overflow:auto;padding-bottom:1rem}
.setup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(22rem,1fr));gap:1rem}
.setup h3{font-size:1.15rem;font-weight:900;margin-bottom:.6rem}
.hint{color:var(--muted);font-weight:700;font-size:.85rem}
.collapse-btn{margin-left:auto}
.collapse-btn.on{--c:var(--blue);--cd:var(--blue-d);color:#fff}
.drawer{position:absolute;left:1.2rem;right:1.2rem;bottom:.3rem;z-index:12;max-height:calc(100% - .6rem);overflow:auto;animation:drawerIn .25s ease;border:.2rem solid #fff}
.drawer.closed{display:none}
@keyframes drawerIn{from{opacity:0;transform:translateY(1rem)}}
.topbar .hud{flex:1 1 auto;justify-content:flex-end}

/* ---------- MENU ---------- */
#menu{background:linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.55)),var(--img-finish) center/cover no-repeat}
#menu .menu-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem;padding:1rem;min-height:0}
.title{font-size:4.2rem;font-weight:900;text-align:center;line-height:1.05;color:#fff;letter-spacing:.02em;
  text-shadow:0 .25rem 0 #e85d04,0 .5rem 0 #9d0208,0 .8rem 1.2rem rgba(0,0,0,.25);animation:titleBob 3s ease-in-out infinite}
.title small{display:block;font-size:1.4rem;color:#1d3557;text-shadow:0 .1rem 0 #fff;margin-top:.5rem;letter-spacing:.01em}
@keyframes titleBob{50%{transform:translateY(-.4rem) rotate(-1deg)}}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,15rem));gap:1.1rem;justify-content:center}
.tile{--c:var(--blue);--cd:var(--blue-d);position:relative;border:0;cursor:pointer;border-radius:1.6rem;padding:1.1rem .8rem 1rem;color:#fff;
  background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 50%),var(--c);box-shadow:0 .45rem 0 var(--cd),0 .8rem 1.4rem rgba(0,0,0,.2);
  display:flex;flex-direction:column;align-items:center;gap:.4rem;font-weight:900;font-size:1.25rem;text-shadow:0 .1rem 0 rgba(0,0,0,.25);
  transition:transform .15s;animation:tileIn .6s backwards}
.tile:hover{transform:translateY(-.35rem) scale(1.03)}
.tile:active{transform:translateY(.3rem)}
.tile .ico{font-size:3rem;filter:drop-shadow(0 .2rem .2rem rgba(0,0,0,.2));animation:icoBob 2.4s ease-in-out infinite}
.tile:nth-child(2) .ico{animation-delay:.3s}.tile:nth-child(3) .ico{animation-delay:.6s}.tile:nth-child(4) .ico{animation-delay:.9s}
.tile:nth-child(5) .ico{animation-delay:1.2s}.tile:nth-child(6) .ico{animation-delay:1.5s}.tile:nth-child(7) .ico{animation-delay:1.8s}
.tile .sub{font-size:.8rem;font-weight:700;opacity:.92;text-shadow:none;line-height:1.2}
@keyframes icoBob{50%{transform:translateY(-.35rem) rotate(6deg)}}
@keyframes tileIn{from{opacity:0;transform:translateY(1.5rem) scale(.9)}}
.menu-road{position:relative;height:5.5rem;flex:0 0 auto;background:linear-gradient(#5c677d,#3f4a5f);border-top:.4rem solid #fff;overflow:hidden}
.menu-road::before{content:"";position:absolute;left:0;right:0;top:50%;height:.4rem;margin-top:-.2rem;
  background:repeating-linear-gradient(90deg,#fff 0 3rem,transparent 3rem 6rem)}
.menu-road img{position:absolute;bottom:.4rem;height:4.4rem;animation:drive 9s linear infinite}
.menu-road img.c2{animation-delay:-4.5s;animation-duration:11s}
@keyframes drive{from{left:-12rem}to{left:105%}}
.cloud{position:absolute;background:#fff;border-radius:50%;opacity:.85;filter:blur(1px);animation:cloud 40s linear infinite;pointer-events:none}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:60%;height:120%;left:15%;top:-55%}.cloud::after{width:45%;height:90%;left:50%;top:-35%}
@keyframes cloud{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
.menu-foot{position:absolute;right:1rem;top:.8rem;display:flex;gap:.5rem;z-index:3}

/* ---------- cars ---------- */
.car{display:block;pointer-events:none;will-change:transform}
.car.yellow{filter:drop-shadow(0 .25rem .2rem rgba(0,0,0,.25))}
.car.red{filter:hue-rotate(-48deg) saturate(1.5) drop-shadow(0 .25rem .2rem rgba(0,0,0,.25))}
.car.green{filter:hue-rotate(60deg) saturate(1.2) drop-shadow(0 .25rem .2rem rgba(0,0,0,.25))}
.car.blue{filter:hue-rotate(160deg) saturate(1.3) drop-shadow(0 .25rem .2rem rgba(0,0,0,.25))}
.car.purple{filter:hue-rotate(230deg) saturate(1.2) drop-shadow(0 .25rem .2rem rgba(0,0,0,.25))}
.car.flip{transform:scaleX(-1)}

/* ---------- SYLLABLE RACES ---------- */
.lanes{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:.6rem;padding:.3rem 0}
.lane{position:relative;display:flex;align-items:center;gap:1rem;height:var(--laneH,10rem);padding:.4rem 1rem;flex:0 0 auto;
  background:linear-gradient(180deg,#f8fdff,#d9f2ff);border-radius:calc(var(--laneH)*.22);box-shadow:inset 0 -.25rem 0 rgba(58,134,255,.18),0 .3rem .8rem rgba(0,0,0,.08);
  border:.18rem solid #fff}
.lanes.two-col{display:grid;grid-template-columns:1fr 1fr;align-content:center;column-gap:1rem;row-gap:.6rem}
.lanes.two-col .lane{min-width:0;gap:.5rem;padding:.4rem .6rem}
.lanes.two-col .track{margin:0 calc(var(--laneH)*.3)}
.lane.active{box-shadow:inset 0 -.25rem 0 rgba(58,134,255,.18),0 0 0 .3rem var(--yellow),0 .3rem 1rem rgba(0,0,0,.12)}
.letter{flex:0 0 auto;height:calc(var(--laneH)*.8);min-width:calc(var(--laneH)*.8);padding:0 calc(var(--laneH)*.08);border-radius:calc(var(--laneH)*.18);
  display:flex;align-items:center;justify-content:center;font-family:var(--read-font);font-weight:900;font-size:calc(var(--laneH)*.6);line-height:1;
  background:linear-gradient(180deg,#fff,#eaf3ff);box-shadow:0 calc(var(--laneH)*.04) 0 #b8cce6,0 .3rem .6rem rgba(0,0,0,.12);border:calc(var(--laneH)*.025) solid #cfe0f5}
.letter.cons{color:#1d4ed8}.letter.vow{color:#e11d48}
.letter.mix span.v{color:#e11d48}.letter.mix span.c{color:#1d4ed8}
.track{position:relative;flex:1 1 auto;height:100%;min-width:0;margin:0 calc(var(--laneH)*.42)}
.track svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.track .car{position:absolute;left:0;top:0;height:calc(var(--laneH)*.46);transform-origin:50% 85%;z-index:2}
.syl-pop{position:absolute;left:50%;top:50%;z-index:3;transform:translate(-50%,-50%) scale(.3);opacity:0;font-family:var(--read-font);font-weight:900;
  font-size:calc(var(--laneH)*.62);line-height:1;padding:.08em .3em;border-radius:.25em;background:#fff;color:var(--ink);
  box-shadow:0 .1em 0 #f4a261,0 .15em .4em rgba(0,0,0,.2);border:.05em solid var(--yellow);pointer-events:none;white-space:nowrap;letter-spacing:.03em}
.syl-pop.show{animation:pop .45s cubic-bezier(.3,1.6,.5,1) forwards}
.syl-pop.stay{opacity:1;transform:translate(-50%,-50%) scale(1)}
@keyframes pop{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.history{flex:0 0 auto;min-height:3rem;display:flex;align-items:center;justify-content:center;gap:.4rem;flex-wrap:wrap;padding:.2rem;
  font-family:var(--read-font);font-weight:800;font-size:1.8rem;color:#33507a}
.history span{background:rgba(255,255,255,.85);padding:.05em .4em;border-radius:.4em}
.history span.last{background:var(--yellow);color:#3d2c00}
.history i{font-style:normal;color:#9db0cc}
.big-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:4}

/* ---------- highlight words ---------- */
.hw{position:relative;display:inline-block;white-space:nowrap;--p:0%;text-indent:0}
.hw::after{content:attr(data-t);position:absolute;left:0;top:0;bottom:0;white-space:nowrap;color:var(--hl);background:none;
  clip-path:inset(-.3em calc(100% - var(--p)) -.3em -.1em);pointer-events:none;width:100%}
.hw:not(.cur)::after{content:none}
.hw.done{color:var(--done)}
.hw.cur{z-index:1}
.reading-word{font-family:var(--read-font);font-weight:800}

/* ---------- WORDS ---------- */
.word-one{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.word-card{background:#fff;border-radius:2rem;padding:2rem 3.5rem;box-shadow:0 .6rem 0 #c8d8ef,0 1rem 2rem rgba(0,0,0,.12);border:.3rem solid #fff;
  width:min(96%,90rem);min-height:55%;display:flex;align-items:center;justify-content:center;text-align:center}
.word-card .hw{font-family:var(--read-font);font-weight:800;line-height:1.15;font-size:calc(min(11vw,24vh)*var(--wsize,1));overflow-wrap:anywhere}
@keyframes cardIn{from{opacity:0;transform:translateY(1rem) scale(.95)}}
.word-grid{flex:1;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:1.2rem;min-height:0;padding:1rem 0}
.word-grid .wc{background:#fff;border-radius:1.4rem;padding:.8rem 1.6rem;box-shadow:0 .4rem 0 #c8d8ef,0 .6rem 1rem rgba(0,0,0,.08);animation:cardIn .35s backwards}
.word-grid .wc:nth-child(odd){background:#fffbea}.word-grid .wc:nth-child(3n){background:#eefbf3}
.word-grid .hw{font-family:var(--read-font);font-weight:800;font-size:calc(3.6rem*var(--wsize,1));line-height:1.2}
.word-rows{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.word-rows{padding:.4rem 0 .8rem}
.word-rows .sheet{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;background:#fff;border-radius:1.6rem;padding:1rem 2.4rem;box-shadow:0 .5rem 1.5rem rgba(0,0,0,.1);line-height:1.5}
.word-rows .row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.2em 1em;align-items:center;font-family:var(--read-font);font-weight:800;font-size:calc(min(4.4vw,9vh)*var(--wsize,1)*var(--rowk,1));padding:.05em 0;border-bottom:.08rem dashed #dde7f4}
.word-rows .row .hw{justify-self:start;white-space:nowrap}

/* ---------- TEXTS / BOOK ---------- */
.lib{display:flex;flex-direction:column;gap:.8rem;min-height:0;flex:1}
.lib-list{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.9rem;padding:.3rem .3rem 1rem;align-content:start}
.tcard{background:#fff;border-radius:1.2rem;padding:.9rem 1rem;box-shadow:0 .3rem 0 #e0d2b5,0 .5rem 1rem rgba(0,0,0,.08);cursor:pointer;border:0;text-align:left;
  display:flex;flex-direction:column;gap:.35rem;transition:transform .12s}
.tcard:hover{transform:translateY(-.2rem)}
.tcard h4{font-size:1.1rem;font-weight:900}
.tcard .meta{display:flex;flex-wrap:wrap;gap:.3rem}
.tag{font-size:.75rem;font-weight:800;padding:.15rem .5rem;border-radius:.5rem;background:#eef4fc;color:#4a5a7a}
.tag.g{background:#e3f9ec;color:#1e8c59}.tag.w{background:#fff3d6;color:#9a6700}.tag.d{background:#ffe3ea;color:#b8304f}.tag.own{background:#efe6ff;color:#6236c4}
.tcard p{font-size:.85rem;color:#6b7a99;font-weight:600;line-height:1.35;max-height:2.7em;overflow:hidden}
.book{flex:1;min-height:0;display:flex;justify-content:center;padding:.4rem 0 .8rem}
/* телесуфлёр: максимум 3 крупные строки, текст плавно едет вверх */
.book.prompter{align-items:center}
.book.prompter .page{--pfs:calc(4.4rem*var(--tsize,1));flex:0 0 auto;height:calc(var(--pfs)*var(--lh,1.8)*3 + 2rem);max-height:100%;overflow:hidden;padding:1rem 3.5rem;scroll-behavior:auto}
.book.prompter .page .txt{font-size:var(--pfs)}
.book.prompter .page .txt p{margin-bottom:0}
.book.prompter .page h3{font-size:calc(var(--pfs)*.85);line-height:var(--lh,1.8);height:calc(var(--pfs)*var(--lh,1.8));margin:0;overflow:hidden}
.page{position:relative;width:min(100%,78rem);background:linear-gradient(90deg,#f6ecd6 0,#fffdf6 3%,#fffdf6 97%,#f6ecd6 100%);border-radius:.6rem 1.4rem 1.4rem .6rem;
  box-shadow:0 .2rem 0 #e6d3ad,0 .5rem 0 #d8bf8f,0 1rem 2rem rgba(80,50,10,.25);overflow:auto;padding:2rem 3.5rem 3rem;scroll-behavior:smooth}
.page h3{text-align:center;font-size:calc(3rem*var(--tsize,1));font-weight:900;color:#7c4a03;margin-bottom:.6em;font-family:var(--read-font)}
.page .txt{font-family:var(--read-font);font-size:calc(3.2rem*var(--tsize,1));line-height:var(--lh,1.8);color:#2b2118;font-weight:600}
.page .txt p{text-indent:1.5em;margin-bottom:.35em}
.page .txt .hw,.word-rows .row .hw{line-height:1.25}
.page.clickable .hw{cursor:pointer}.page.clickable .hw:hover{background:#ffe8a3;border-radius:.2em}
.page .hw.stopmark{background:#ffd6e0;border-radius:.2em;box-shadow:0 0 0 .1em #ff8fab}
.result{max-width:52rem;margin:auto;text-align:center;display:flex;flex-direction:column;gap:1rem;align-items:center}
.result .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.8rem;width:100%}
.stat{background:#fff;border-radius:1rem;padding:.8rem;box-shadow:0 .3rem 0 #dbe7f7}
.stat b{display:block;font-size:2rem;color:var(--blue)}
.stat span{font-weight:800;color:#6b7a99;font-size:.9rem}
.quiz{width:100%;display:flex;flex-direction:column;gap:1rem;text-align:left}
.q{background:#fff;border-radius:1rem;padding:1rem;box-shadow:0 .3rem 0 #dbe7f7}
.q h4{font-size:1.3rem;margin-bottom:.6rem}
.q .ans{display:flex;flex-wrap:wrap;gap:.6rem}
.q .ans button{border:0;cursor:pointer;background:#eef4fc;border-radius:.8rem;padding:.6rem 1rem;font-weight:800;font-size:1.1rem;box-shadow:0 .2rem 0 #cfdbec}
.q .ans button.ok{background:#c9f5d9;box-shadow:0 .2rem 0 #2ec27e}
.q .ans button.no{background:#ffe1e8;box-shadow:0 .2rem 0 #ef9aae;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-.3rem)}75%{transform:translateX(.3rem)}}
.q .fb{margin-top:.5rem;font-weight:800;min-height:1.3em}

/* ---------- BLITZ ---------- */
.blitz-stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;perspective:80rem}
.bcard{width:min(94%,90rem);height:min(75%,40rem);display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem 3rem;border-radius:2.4rem;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 40%),var(--bc,#4cc9f0);box-shadow:0 .8rem 0 rgba(0,0,0,.18),0 1.4rem 2.4rem rgba(0,0,0,.18);
  border:.4rem solid #fff}
.bcard .bt{font-family:var(--read-font);font-weight:900;color:#13294b;font-size:calc(8rem*var(--bsize,1));line-height:1.15;text-shadow:0 .15rem 0 rgba(255,255,255,.6)}
.bcard .bt.mid{font-size:calc(5.5rem*var(--bsize,1))}.bcard .bt.long{font-size:calc(3.6rem*var(--bsize,1))}
.bcard.anim-in{animation:flipIn .35s ease-out}
.bcard.anim-out{animation:flipOut .25s ease-in forwards}
@keyframes flipIn{from{opacity:0;transform:rotateY(-70deg) scale(.85)}}
@keyframes flipOut{to{opacity:0;transform:rotateY(70deg) scale(.85)}}
.bar{height:.9rem;background:rgba(255,255,255,.7);border-radius:1rem;overflow:hidden;box-shadow:inset 0 .1rem .2rem rgba(0,0,0,.1);min-width:10rem;flex:1}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),#8be38f);border-radius:1rem;transition:width .2s}
.countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;background:rgba(255,255,255,.55);backdrop-filter:blur(3px)}
.countdown b{font-size:16rem;font-weight:900;color:var(--orange);text-shadow:0 .5rem 0 var(--orange-d),0 1rem 2rem rgba(0,0,0,.2);animation:cd 1s ease-out}
@keyframes cd{from{transform:scale(2);opacity:0}30%{transform:scale(1);opacity:1}to{transform:scale(.9);opacity:.9}}

/* ---------- TOGETHER ---------- */
.hud{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.rest{position:absolute;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;background:rgba(240,247,255,.93)}
.rest .box{background:#fff;border-radius:2rem;padding:2rem 3rem;text-align:center;box-shadow:0 1rem 3rem rgba(0,0,0,.15);display:flex;flex-direction:column;gap:1rem;align-items:center;max-width:92%}
.rest h3{font-size:2.4rem}.rest .big{font-size:5rem;font-weight:900;color:var(--green)}
.breathe{width:7rem;height:7rem;border-radius:50%;background:radial-gradient(circle,#b9fbc0,#72efdd);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.3)}}

/* ---------- CHALLENGE ---------- */
.levels{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:1rem;align-items:center;padding:1rem 0;min-height:0}
.level{border:0;cursor:pointer;border-radius:1.6rem;padding:1.2rem .8rem;background:#fff;box-shadow:0 .5rem 0 #c8d8ef,0 .8rem 1.4rem rgba(0,0,0,.12);
  display:flex;flex-direction:column;align-items:center;gap:.5rem;transition:transform .15s;position:relative}
.level:hover{transform:translateY(-.4rem)}
.level .num{width:3.4rem;height:3.4rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:900;color:#fff;
  background:var(--c);box-shadow:0 .25rem 0 rgba(0,0,0,.2)}
.level .ico{font-size:3.4rem}
.level h4{font-size:1.3rem;font-weight:900}
.level p{font-size:.85rem;color:#6b7a99;font-weight:700;text-align:center}
.stars{font-size:1.6rem;letter-spacing:.1rem;color:#d7deea}
.stars .on{color:#ffc300;text-shadow:0 .1rem 0 #d48806}
.medals{font-weight:800;font-size:.85rem;color:#9a6700}
.race-road{position:relative;height:4.6rem;margin:.4rem 0;background:linear-gradient(#6c757d,#495057);border-radius:1rem;border:.25rem solid #fff;flex:0 0 auto}
.race-road::before{content:"";position:absolute;left:1rem;right:4rem;top:50%;height:.3rem;margin-top:-.15rem;background:repeating-linear-gradient(90deg,#fff 0 2rem,transparent 2rem 4rem)}
.race-road .flag{position:absolute;right:.6rem;top:50%;transform:translateY(-50%);font-size:2.8rem}
.race-road .car{position:absolute;top:50%;height:3.8rem;transform:translate(-50%,-55%);left:3rem;transition:left .3s linear}
.finish{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.45)),var(--img-finish) center/cover;animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0}}
.finish .box{background:rgba(255,255,255,.95);border-radius:2rem;padding:1.6rem 3rem;text-align:center;box-shadow:0 1rem 3rem rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;gap:.7rem;
  animation:boxIn .6s cubic-bezier(.3,1.5,.5,1);max-width:92%}
@keyframes boxIn{from{transform:scale(.5);opacity:0}}
.finish h3{font-size:2.8rem;font-weight:900;color:var(--orange);text-shadow:0 .2rem 0 var(--orange-d)}
.finish .trophy{height:9rem;animation:trophy 1.6s ease-in-out infinite}
@keyframes trophy{50%{transform:translateY(-.5rem) rotate(4deg)}}
.finish .bigstars{font-size:4rem;display:flex;gap:.5rem}
.finish .bigstars span{color:#ffc300;text-shadow:0 .25rem 0 #d48806;animation:starIn .5s backwards}
.finish .bigstars span:nth-child(2){animation-delay:.3s}.finish .bigstars span:nth-child(3){animation-delay:.6s}.finish .bigstars span:nth-child(4){animation-delay:.9s}
@keyframes starIn{from{transform:scale(0) rotate(-180deg);opacity:0}}
.badge{background:linear-gradient(180deg,#fff3c4,#ffd166);border-radius:1rem;padding:.5rem 1.2rem;font-weight:900;color:#7a4d00;box-shadow:0 .25rem 0 #d9a800}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:31}
.confetti i{position:absolute;top:-2rem;width:.8rem;height:1.2rem;border-radius:.2rem;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- SETTINGS / OWN ---------- */
.tabs{display:flex;gap:.4rem;flex-wrap:wrap}
.tabs button{border:0;cursor:pointer;padding:.6rem 1.1rem;border-radius:1rem 1rem 0 0;font-weight:900;background:rgba(255,255,255,.55);color:#4a5a7a}
.tabs button.on{background:#fff;color:var(--blue)}
.tabpane{flex:1;min-height:0;overflow:auto;background:#fff;border-radius:0 1.2rem 1.2rem 1.2rem;padding:1.2rem;margin-bottom:1rem}
.presets{display:flex;flex-wrap:wrap;gap:.4rem}
.own-list{display:flex;flex-direction:column;gap:.6rem;margin-top:1rem}
.own-item{display:flex;gap:.8rem;align-items:center;background:#f6f9fe;border-radius:1rem;padding:.6rem .9rem;flex-wrap:wrap}
.own-item .nm{font-weight:900;flex:1;min-width:10rem}
.own-item .nm small{display:block;font-weight:700;color:var(--muted)}
.carpick{display:flex;gap:.6rem;flex-wrap:wrap}
.carpick button{border:.2rem solid transparent;background:#f1f6fd;border-radius:1rem;padding:.4rem .6rem;cursor:pointer}
.carpick button.on{border-color:var(--green);background:#e3f9ec}
.carpick img{height:3rem}
.bgpick{display:flex;gap:.6rem;flex-wrap:wrap}
.bgpick button{width:5.5rem;height:3.4rem;border-radius:.8rem;border:.25rem solid #fff;cursor:pointer;box-shadow:0 .2rem .5rem rgba(0,0,0,.15);font-weight:800;font-size:.75rem;color:#334}
.bgpick button.on{border-color:var(--green)}
.toast{position:fixed;left:50%;bottom:6rem;transform:translateX(-50%);background:#1d3557;color:#fff;padding:.8rem 1.4rem;border-radius:1rem;font-weight:800;z-index:100;
  animation:fadeIn .3s;box-shadow:0 .5rem 1rem rgba(0,0,0,.25);max-width:90%;text-align:center}
.modal{position:fixed;inset:0;z-index:90;background:rgba(20,30,50,.45);display:flex;align-items:center;justify-content:center;padding:1rem}
.modal .box{background:#fff;border-radius:1.5rem;padding:1.4rem 1.6rem;max-width:56rem;width:100%;max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:.8rem;animation:boxIn .3s}
.modal h3{font-size:1.4rem}
.row-btns{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:2rem;text-align:center;color:var(--muted);font-weight:800}
.qedit{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:.4rem;align-items:center}
.qedit input{border:.12rem solid #dbe7f7;border-radius:.5rem;padding:.35rem;font-weight:700;min-width:0}

/* ---------- responsive ---------- */
@media (max-width:1000px){
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .levels{grid-template-columns:repeat(3,1fr);overflow:auto;align-content:start}
}
@media (max-width:640px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
  .tile{font-size:1.05rem;padding:.8rem .5rem}.tile .ico{font-size:2.3rem}
  .title{font-size:2.6rem}.title small{font-size:1rem}
  .levels{grid-template-columns:repeat(2,1fr)}
  .page{padding:1.2rem 1.2rem 2rem}
  .word-card{padding:1.2rem 1.4rem}
  .lane{gap:.4rem;padding:.3rem .5rem}
  .topbar h2{font-size:1.3rem}
  .setup-grid{grid-template-columns:1fr}
  .qedit{grid-template-columns:1fr 1fr}
  .speed input{width:3.8rem}
  .bcard{padding:1.2rem 1rem;min-width:80%}
  .bcard .bt{font-size:calc(4.6rem*var(--bsize,1))}.bcard .bt.mid{font-size:calc(3.2rem*var(--bsize,1))}.bcard .bt.long{font-size:calc(2.2rem*var(--bsize,1))}
  .word-card .hw{font-size:calc(3.6rem*var(--wsize,1))}
  .word-grid .hw{font-size:calc(2.2rem*var(--wsize,1))}
  .word-rows .row{font-size:calc(1.7rem*var(--wsize,1))}
  .page h3,.page .txt{font-size:calc(1.5rem*var(--tsize,1))}
  .controls .btn.big{font-size:1.05rem;padding:.6rem 1rem;min-height:2.8rem}
}
.bcard .bt{overflow-wrap:anywhere}
@media (max-height:520px){ .menu-road{height:3.5rem}.menu-road img{height:2.8rem}.tile .ico{font-size:2rem}.title{font-size:2.6rem}}

</style>

// <span class="hw" data-t="слово">слово</span>; --p управляет заливкой
function hwEl(text, extra) { return h('span', { class: 'hw' + (extra ? ' ' + extra : ''), 'data-t': text }, text); }
const HL = {
  // measure boundaries of characters for «посимвольной» подсветки
  bounds(el) {
    const node = el.firstChild; if (!node || node.nodeType !== 3) return null;
    const total = el.getBoundingClientRect(); const w = total.width || 1; const out = [0];
    const r = document.createRange();
    for (let i = 1; i <= node.length; i++) { r.setStart(node, 0); r.setEnd(node, i); const rc = r.getBoundingClientRect(); out.push(clamp((rc.right - total.left) / w, 0, 1)); }
    out[out.length - 1] = 1; return out;
  },
  set(el, p, mode) {
    // mode: smooth | char | whole
    let v = p;
    if (mode === 'whole') v = p > 0 ? 1 : 0;
    else if (mode === 'char') {
      if (!el._b) el._b = HL.bounds(el);
      const b = el._b; if (b) { const n = b.length - 1; const k = Math.min(n, Math.ceil(p * n - 1e-6)); v = b[Math.max(0, k)]; }
    }
    el.style.setProperty('--p', (v * 100).toFixed(2) + '%');
  },
  start(el) { el.classList.add('cur'); el.classList.remove('done'); el._b = null; },
  done(el) { el.classList.remove('cur'); el.classList.add('done'); el.style.setProperty('--p', '0%'); },
  reset(el) { el.classList.remove('cur', 'done'); el.style.setProperty('--p', '0%'); }
};

/* ---------- элементы управления ---------- */
const SPEED_PRESETS = [20, 30, 40, 50, 60, 80, 100, 120, 150, 180, 200];
function speedWidget({ get, set, min = 10, max = 300, unit = 'слов/мин' }) {
  const inp = h('input', { type: 'number', min, max, step: 1, inputmode: 'numeric', 'aria-label': 'Скорость' });
  const lbl = h('span', { class: 'lbl' }, unit.split('/')[0], h('br'), 'в мин');
  const sel = h('select', { 'aria-label': 'Предустановки скорости' });
  const fill = () => {
    sel.innerHTML = ''; sel.append(h('option', { value: '' }, '▾'));
    SPEED_PRESETS.filter(v => v >= min && v <= max).forEach(v => sel.append(h('option', { value: v }, v)));
  };
  const apply = v => { v = clamp(Math.round(+v || min), min, max); inp.value = v; set(v); };
  inp.addEventListener('change', () => apply(inp.value));
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { apply(inp.value); inp.blur(); } e.stopPropagation(); });
  sel.addEventListener('change', () => { if (sel.value) apply(sel.value); sel.value = ''; });
  const step = d => apply((+inp.value || 0) + d);
  const box = h('div', { class: 'speed' },
    h('button', { class: 'btn small orange round', title: 'Медленнее', onclick: () => step(-5) }, '−'),
    inp,
    h('button', { class: 'btn small green round', title: 'Быстрее', onclick: () => step(5) }, '+'),
    lbl, sel);
  fill(); inp.value = get();
  box.setUnit = (u, mn, mx) => { lbl.innerHTML = ''; lbl.append(u.split('/')[0], h('br'), 'в мин'); min = mn; max = mx; inp.min = mn; inp.max = mx; fill(); apply(get()); };
  box.refresh = () => { inp.value = get(); };
  return box;
}
// стандартная панель: Старт / Пауза / Продолжить / Повторить / Назад
function controlBar({ onStart, onPause, onResume, onRepeat, onBack, extra = [] }) {
  const bStart = h('button', { class: 'btn green big' }, '▶ Старт');
  const bPause = h('button', { class: 'btn yellow big' }, '⏸ Пауза');
  const bRepeat = h('button', { class: 'btn purple big' }, '↻ Повторить');
  const bBack = h('button', { class: 'btn white big' }, '← Назад');
  let state = 'idle';
  const set = st => {
    state = st;
    bStart.style.display = st === 'idle' || st === 'done' ? '' : 'none';
    bPause.style.display = st === 'run' || st === 'pause' ? '' : 'none';
    bPause.textContent = st === 'pause' ? '▶ Продолжить' : '⏸ Пауза';
    bPause.className = 'btn big ' + (st === 'pause' ? 'green' : 'yellow');
    bRepeat.disabled = st === 'idle';
  };
  bStart.onclick = () => onStart();
  bPause.onclick = () => state === 'pause' ? onResume() : onPause();
  bRepeat.onclick = () => onRepeat();
  bBack.onclick = () => onBack();
  const el = h('div', { class: 'controls' }, bBack, bStart, bPause, bRepeat, ...extra);
  set('idle');
  return { el, set, get state() { return state; }, toggle() { if (state === 'run') onPause(); else if (state === 'pause') onResume(); else if (state === 'idle' || state === 'done') onStart(); } };
}
function seg(options, value, onChange) {
  const box = h('div', { class: 'seg' });
  options.forEach(([v, t]) => box.append(h('button', { class: v === value ? 'on' : '', onclick: e => { $$('button', box).forEach(b => b.classList.remove('on')); e.currentTarget.classList.add('on'); onChange(v); } }, t)));
  return box;
}
function selectEl(options, value, onChange) {
  const s = h('select', { onchange: () => onChange(s.value) });
  options.forEach(([v, t]) => s.append(h('option', { value: v, selected: String(v) === String(value) }, t)));
  return s;
}
function field(label, control, hint) { return h('label', { class: 'field' }, label, control, hint ? h('span', { class: 'hint' }, hint) : null); }
function numInput(value, min, max, onChange, step = 1) {
  const i = h('input', { type: 'number', min, max, step, value });
  i.addEventListener('change', () => { const v = clamp(Math.round(+i.value / step) * step || min, min, max); i.value = v; onChange(v); });
  i.addEventListener('keydown', e => e.stopPropagation());
  return i;
}
function check(label, value, onChange) {
  const i = h('input', { type: 'checkbox', checked: !!value, onchange: () => onChange(i.checked) });
  return h('label', { class: 'check' }, i, label);
}
function carImg(color, extra = '') { return h('img', { class: 'car ' + (color || S.car) + (extra ? ' ' + extra : ''), src: IMG.car, alt: '', draggable: false }); }
function modal(title, body, buttons) {
  const m = h('div', { class: 'modal', onclick: e => { if (e.target === m) close(); } });
  const close = () => m.remove();
  m.append(h('div', { class: 'box' }, h('h3', null, title), body, h('div', { class: 'row-btns' }, ...(buttons || [['Закрыть', 'white']]).map(([t, c, fn]) => h('button', { class: 'btn ' + c, onclick: () => { if (!fn || fn() !== false) close(); } }, t)))));
  document.body.append(m); return { close, el: m };
}
function countdown(parent, done) {
  const box = h('div', { class: 'countdown' }); parent.append(box);
  let n = 3; const step = () => {
    if (!box.isConnected) return;
    if (n === 0) { box.remove(); Sound.beep(true); done(); return; }
    box.innerHTML = ''; box.append(h('b', null, n)); Sound.beep(false); n--; box._t = setTimeout(step, 850);
  };
  step(); return box;
}
function confetti(parent) {
  const c = h('div', { class: 'confetti' }); const cols = ['#ef476f', '#ffd166', '#06d6a0', '#118ab2', '#8e5cf7', '#ff8c42'];
  for (let i = 0; i < 70; i++) c.append(h('i', { style: { left: Math.random() * 100 + '%', background: pick(cols), animationDuration: (2 + Math.random() * 2.5) + 's', animationDelay: Math.random() * 1.2 + 's' } }));
  parent.append(c); setTimeout(() => c.remove(), 6000);
}

/* ---------- экраны ---------- */
const Screens = {}; let currentScreen = null;
function registerScreen(id, obj) { Screens[id] = obj; }
function go(id, arg) {
  if (currentScreen && Screens[currentScreen].leave) Screens[currentScreen].leave();
  $$('.screen').forEach(s => s.classList.remove('active'));
  const sc = Screens[id]; currentScreen = id;
  if (!sc.el) { sc.el = h('section', { class: 'screen', id }); $('#app').append(sc.el); sc.build(sc.el); }
  sc.enter && sc.enter(arg);
  void sc.el.offsetWidth; sc.el.classList.add('active');
}
function screenShell(el, title, bgClass) {
  el.className = 'screen ' + (bgClass || 'bg-' + S.bg);
  el.dataset.bgfixed = bgClass ? '1' : '';
  const top = h('div', { class: 'topbar' }, h('h2', null, title));
  const stage = h('div', { class: 'stage' });
  el.append(top, stage);
  return { top, stage };
}
function refreshBackgrounds() { $$('.screen').forEach(s => { if (s.id !== 'menu' && !s.dataset.bgfixed) { s.className = s.className.replace(/\bbg-\w+/g, '').trim() + ' bg-' + S.bg; } }); }
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) return;
  const sc = Screens[currentScreen]; if (!sc) return;
  if (e.code === 'Space' && sc.bar) { e.preventDefault(); sc.bar.toggle(); }
  if (e.key === 'Escape' && $('.modal')) { $('.modal').remove(); return; }
  if (e.key === 'Escape' && currentScreen !== 'menu') go('menu');
});
function toggleFullscreen() {
  const d = document;
  if (!d.fullscreenElement && !d.webkitFullscreenElement) { const el = d.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen).call(el); }
  else (d.exitFullscreen || d.webkitExitFullscreen).call(d);
}
// pause when tab hidden
document.addEventListener('visibilitychange', () => { if (document.hidden) { const sc = Screens[currentScreen]; if (sc && sc.bar && sc.bar.state === 'run') sc.bar.toggle(); } });

{ t: 'Первый снег', g: 2, th: 'времена года', x: `Ночью выпал первый снег. Утром Карина подбежала к окну и ахнула. Всё вокруг стало белым: крыши, деревья, скамейки и машины. Снежинки медленно кружились в воздухе.

{ t: 'Умный попугай', g: 2, th: 'животные', x: `У моей тёти живёт попугай Кеша. Он зелёный, с жёлтой головкой. Кеша умеет говорить. Утром он кричит: «Доброе утро! Пора вставать!» Когда звонит телефон, Кеша говорит: «Алло, алло!»

{ t: 'Горы Алатау', g: 3, th: 'Казахстан', x: `Рядом с Алматы возвышаются горы Заилийского Алатау. Их вершины покрыты снегом даже летом. Летом в горах цветут маки и эдельвейсы. По склонам растут высокие тянь-шаньские ели.

{ t: 'Бабушкин сад', g: 2, th: 'семья', x: `Летом я живу у бабушки в деревне. У неё большой сад. Там растут яблони, груши и вишни. На грядках зреют огурцы, помидоры и морковь.

{ t: 'Велосипед', g: 2, th: 'дружба', x: `На день рождения Никите подарили велосипед. Он был синий и блестящий. Никита сразу поехал кататься. Во дворе он увидел своего друга Ерлана. У Ерлана велосипеда не было, и он грустно смотрел на Никиту.

{ t: 'Зимняя прогулка', g: 3, th: 'времена года', x: `В субботу вся семья отправилась в лес на лыжах. Мороз щипал щёки, а снег искрился на солнце. Лыжня петляла между заснеженными елями.

{ t: 'Кто сильнее?', g: 2, th: 'сказки', x: `Поспорили однажды Солнце и Ветер, кто из них сильнее. Увидели они путника в тёплом плаще. «Кто снимет с него плащ, тот и сильнее», — решили они.

{ t: 'Морское путешествие', g: 3, th: 'путешествия', x: `Летом мы ездили на Каспийское море. Это самое большое озеро в мире, но его называют морем, потому что оно огромное и солёное.

{ t: 'Медвежонок и мёд', g: 2, th: 'сказки', x: `Жил в лесу медвежонок Топтыжка. Больше всего на свете он любил мёд. Однажды он нашёл дупло, где жили дикие пчёлы. Топтыжка засунул в дупло лапу и вытащил кусок сладких сот.

{ t: 'Друзья познаются в беде', g: 3, th: 'дружба', x: `Аня и Света дружили с первого класса. Они сидели за одной партой и вместе ходили домой. Однажды Света сломала ногу и попала в больницу. Целый месяц ей нельзя было ходить в школу.

{ t: 'Поход в зоопарк', g: 1, th: 'животные', x: `В воскресенье мы всей семьёй пошли в зоопарк. Сначала мы увидели жирафа. У него очень длинная шея, и он ел листья прямо с верхушки дерева. Потом мы подошли к слону. Слон набирал хоботом воду и поливал себя, как из душа.

{ t: 'Осенняя экскурсия', g: 2, th: 'школа', x: `В октябре наш класс отправился на экскурсию в парк. Учительница попросила нас собрать красивые листья для гербария. Мы бегали по дорожкам и искали самые яркие.

{ t: 'Аист', g: 3, th: 'природа', x: `Весной на крышу старого дома прилетел аист. Он принёс в клюве ветку, потом ещё одну. Скоро на крыше появилось большое гнездо. Вслед за ним прилетела аистиха. Через месяц в гнезде запищали птенцы.

{ t: 'Домбра', g: 3, th: 'Казахстан', x: `Домбра — казахский народный музыкальный инструмент. У неё длинный гриф и две струны. Корпус домбры делают из дерева и по форме он напоминает каплю или ковш.

{ t: 'Волшебное слово', g: 2, th: 'добрые поступки', x: `Петя был сердитым мальчиком. Он требовал всё грубо: «Дай!», «Принеси!», «Отстань!» И никто не хотел ему помогать. Однажды в парке Петя сел на скамейку рядом со старичком.

{ t: 'Поездка на Боровое', g: 3, th: 'путешествия', x: `Прошлым летом мы отдыхали в Боровом. Это удивительное место на севере Казахстана. Здесь среди степи стоят сосновые леса и сверкают голубые озёра. Боровое называют казахстанской Швейцарией. Там можно купаться, кататься на лодке и собирать в лесу грибы и ягоды.

{ t: 'Старый пёс', g: 3, th: 'животные', x: `У дедушки живёт старый пёс по кличке Дружок. Раньше он сторожил дом и громко лаял на чужих. Теперь Дружок постарел. Он плохо видит и долго спит на солнышке у крыльца.

{ t: 'Как растёт хлеб', g: 3, th: 'природа', x: `Каждый день мы едим хлеб и редко задумываемся, откуда он берётся. А путь хлеба к нашему столу долгий и трудный.

{ t: 'Котёнок Пушок ищет маму', g: 2, th: 'животные', x: `Маленький котёнок Пушок проснулся в корзинке и не увидел маму-кошку. Он вылез из корзинки и отправился её искать.

{ t: 'Школьный концерт', g: 3, th: 'школа', x: `Перед праздником Наурыз в нашей школе готовили большой концерт. Каждый класс должен был показать свой номер. Мы решили исполнить казахскую песню и станцевать танец.

{ t: 'Мой дедушка', g: 3, th: 'семья', x: `Мой дедушка Бахыт — самый мудрый человек на свете. Ему семьдесят лет, но он бодрый и весёлый. Всю жизнь дедушка работал учителем математики в сельской школе. Его до сих пор помнят и уважают многие ученики.

Вечерами мы играем в шахматы или тогыз кумалак. Сначала я всегда проигрывал. Дедушка не поддавался, а объяснял мне ошибки. Теперь я иногда выигрываю, и дедушка радуется больше меня. Он говорит, что учиться никогда не поздно, и сам недавно начал изучать английский язык.

  q: [['Кем работал дедушка?', 'Учителем математики', 'Врачом', 'Пастухом'], ['Как дедушка находил дорогу домой в детстве?', 'По звёздам', 'По компасу', 'По карте'], ['Во что играют вечерами?', 'В шахматы и тогыз кумалак', 'В футбол', 'В прятки']] },
{ t: 'Подснежник', g: 2, th: 'времена года', x: `В конце марта в лесу ещё лежал снег. Но солнце грело всё сильнее, и снег начал оседать. Под старой берёзой появилась первая проталинка.
Из земли показался маленький зелёный росток. Он осторожно потянулся к свету. Холодный ветер дул на него, но росток не сдавался. Через несколько дней на нём раскрылся нежный белый цветок. Это был подснежник.
Мимо пробегал заяц. Он удивился: «Как ты не боишься мороза?» — «Я очень ждал весну, — ответил цветок. — Кто-то же должен первым сказать лесу, что зима уходит».
Скоро вокруг подснежника появились другие цветы. Прилетели птицы, проснулись жуки. Лес наполнился звуками и красками. А маленький подснежник радовался, что принёс в лес весну.
Подснежники занесены в Красную книгу. Их нельзя срывать — пусть радуют всех. Лучше полюбоваться цветком и оставить его в лесу.`,
  q: [['Где появилась первая проталинка?', 'Под старой берёзой', 'У реки', 'На поляне'], ['Какого цвета был цветок?', 'Белого', 'Синего', 'Жёлтого'], ['Почему подснежники нельзя срывать?', 'Они занесены в Красную книгу', 'Они ядовиты', 'Они колючие']] },
{ t: 'Девочка и щенок', g: 3, th: 'добрые поступки', x: `Холодным осенним вечером Зарина возвращалась из музыкальной школы. Шёл дождь, и она торопилась домой. Вдруг из-под скамейки донёсся тихий писк. Зарина наклонилась и увидела мокрого дрожащего щенка.
Девочка не смогла пройти мимо. Она завернула щенка в свой шарф и принесла домой. Мама сначала нахмурилась, но, увидев малыша, смягчилась. Вместе они вымыли щенка, накормили тёплой кашей и уложили в коробку со старым свитером.
На следующий день Зарина повесила во дворе объявление: «Найден щенок». Но хозяин так и не нашёлся. Тогда семья решила оставить щенка себе. Его назвали Джек.
Прошло два года. Джек вырос в большого умного пса с рыжими пятнами на спине. Он умеет давать лапу и приносить мяч. Он встречает Зарину из школы и провожает до самой двери. А Зарина знает: тот дождливый вечер подарил ей самого верного друга.`,
  q: [['Откуда возвращалась Зарина?', 'Из музыкальной школы', 'Из магазина', 'Из гостей'], ['Во что завернула щенка Зарина?', 'В шарф', 'В куртку', 'В полотенце'], ['Как назвали щенка?', 'Джек', 'Рекс', 'Бим']] },
{ t: 'Почему у зайца длинные уши', g: 2, th: 'сказки', x: `Давным-давно у зайца были совсем короткие уши, как у мышки. Заяц очень боялся всех вокруг и прятался под каждым кустом.
Однажды он пришёл к мудрой сове и пожаловался: «Я ничего не слышу издалека. Пока я замечу лису или волка, они уже рядом. Как мне спастись?»
Сова подумала и сказала: «Каждое утро тянись к солнцу и прислушивайся ко всем звукам леса. Слушай, как шуршат листья, как поют птицы, как журчит ручей».
Заяц стал делать так каждый день. Он вытягивал шею и слушал, слушал, слушал. И его уши понемногу стали расти. Через год они стали длинными-предлинными.
Теперь заяц слышит даже, как ступает лиса по мягкому мху за сто шагов. Он успевает убежать от любой опасности. С тех пор у всех зайцев длинные уши. Так говорят в народе.`,
  q: [['К кому пришёл заяц за советом?', 'К сове', 'К медведю', 'К ежу'], ['Какие уши были у зайца раньше?', 'Короткие', 'Круглые', 'Большие'], ['За сколько шагов заяц слышит лису?', 'За сто шагов', 'За десять шагов', 'За тысячу шагов']] },
{ t: 'Путешествие капельки', g: 3, th: 'природа', x: `Жила в море маленькая капелька. Однажды солнце сильно нагрело воду, и капелька превратилась в лёгкий пар. Она поднялась высоко в небо и встретила там много других капелек. Вместе они образовали большое белое облако.
Ветер погнал облако над морем, над степью, к высоким горам. Наверху было холодно. Капельки прижались друг к другу, стали тяжёлыми, и облако превратилось в тучу. Пошёл дождь. Наша капелька упала на склон горы.
Вместе с другими каплями она побежала вниз ручейком. Ручеёк влился в горную речку, речка — в большую реку. Река несла капельку через поля и города. По дороге капелька напоила деревья и цветы.
А через долгое время река снова принесла её в море. Так капелька совершила круговорот воды в природе. А скоро солнце снова пригреет, и путешествие начнётся сначала.`,
  q: [['Во что превратилась капелька от тепла?', 'В пар', 'В лёд', 'В снег'], ['Куда упала капелька с дождём?', 'На склон горы', 'В море', 'На поле'], ['Как называется путешествие капельки?', 'Круговорот воды', 'Морской поход', 'Полёт облаков']] },
{ t: 'Капитан команды', g: 4, th: 'дружба', x: `Даурена выбрали капитаном школьной футбольной команды. Он был лучшим нападающим и забивал больше всех голов. Но однажды на тренировке тренер сказал: «Хороший капитан думает не только о своих голах».
Даурен не понял этих слов. В следующем матче он всё время вёл мяч сам и не отдавал передач. Команда проиграла. После игры вратарь Саша сидел расстроенный. Ребята молчали.
Вечером Даурен долго думал. Он вспомнил, как Нурлан открывался для удара, а он не заметил его. Как Саша кричал: «Пасуй!» — а он не услышал.
На следующей тренировке Даурен извинился перед командой. Он стал внимательнее к друзьям, подбадривал их и раздавал точные передачи. Через месяц команда выиграла школьный турнир. Решающий гол забил Нурлан после передачи капитана. И это была самая радостная победа в жизни Даурена.`,
  q: [['Кем был Даурен в команде?', 'Капитаном', 'Вратарём', 'Тренером'], ['Почему команда проиграла?', 'Даурен не отдавал передач', 'Шёл дождь', 'Вратарь заболел'], ['Кто забил решающий гол на турнире?', 'Нурлан', 'Даурен', 'Саша']] },
{ t: 'Зимние забавы', g: 2, th: 'времена года', x: `Зима — самое весёлое время года! Как только выпадает снег, все дети выбегают во двор.
Малыши катаются на санках с горки. Они визжат от восторга, когда санки разгоняются. Ребята постарше строят снежную крепость. Они лепят большие снежные кирпичи и складывают из них высокие стены. А потом начинается весёлая игра в снежки.
В парке залили каток. Там катаются на коньках и взрослые, и дети. Кто-то уже умеет делать красивые повороты, а кто-то только учится и держится за бортик. Я тоже сначала падал, но папа помог мне, и теперь я катаюсь уверенно.
По выходным мы всей семьёй ходим на лыжах в лес. Там тихо и красиво, ели стоят в белых шубах.
Вечером мы возвращаемся домой с румяными щеками. Мама наливает нам горячий чай с малиновым вареньем. Как хорошо зимой!`,
  q: [['Что строят ребята постарше?', 'Снежную крепость', 'Горку', 'Снеговика'], ['Кто помог научиться кататься на коньках?', 'Папа', 'Тренер', 'Старший брат'], ['С каким вареньем пьют чай?', 'С малиновым', 'С клубничным', 'С вишнёвым']] },

{ t: 'Горный барс', g: 4, th: 'Казахстан', x: `Высоко в горах Тянь-Шаня и Алтая живёт один из самых загадочных хищников — снежный барс, или ирбис. Увидеть его в природе удаётся очень немногим людям, ведь барс осторожен и скрытен.
Ирбис — большая и красивая кошка. Его густая серебристо-серая шерсть покрыта тёмными пятнами в виде колец. Такая окраска помогает барсу незаметно сливаться со скалами и снегом. Длинный пушистый хвост служит ему рулём в прыжке, а в холодную ночь барс укрывает им нос и лапы, как тёплым шарфом. Широкие мягкие лапы не дают зверю проваливаться в глубокий снег.
Барс прекрасно прыгает. Он может перемахнуть через пропасть шириной в несколько метров. Охотится ирбис на горных козлов и баранов, подкрадываясь к ним среди камней. Зимой, когда в горах выпадает много снега, барсы спускаются ниже, вслед за своей добычей. Самка барса растит котят одна. Обычно у неё рождается два или три пушистых малыша.
Снежный барс — символ Казахстана. Его изображение можно увидеть на гербе города Алматы. К сожалению, барсов осталось очень мало. Их занесли в Красную книгу. Учёные изучают ирбисов с помощью скрытых фотоловушек, а в заповедниках их надёжно охраняют. Каждый из нас должен беречь природу, чтобы этот прекрасный зверь навсегда остался в наших горах.`,
  q: [['Как ещё называют снежного барса?', 'Ирбис', 'Манул', 'Каракал'], ['Для чего барсу длинный хвост?', 'Для равновесия в прыжке и тепла', 'Для защиты от врагов', 'Для плавания'], ['На гербе какого города изображён барс?', 'Алматы', 'Астаны', 'Караганды']] },
{ t: 'Как Алия победила страх', g: 3, th: 'школа', x: `Алия очень хорошо читала стихи. Дома она рассказывала их маме с выражением и без единой ошибки. Но стоило ей выйти к доске, как голос становился тихим, а слова путались. Алия краснела и замолкала. Ей казалось, что все над ней смеются.
Однажды учительница объявила, что в школе пройдёт конкурс чтецов. «Алия, может быть, ты попробуешь?» — спросила она. Девочка покачала головой. Но вечером мама сказала: «Страх похож на тень. Он кажется большим, пока ты от него убегаешь. А если повернуться к нему лицом, он становится маленьким».
Алия решила попробовать. Каждый день она репетировала: сначала перед зеркалом, потом перед бабушкой, потом перед младшим братом и его друзьями. Друзья слушали внимательно и хлопали. Сначала Алия запиналась, но с каждым разом читала всё увереннее. Она научилась делать паузы и смотреть слушателям в глаза.
В день конкурса у Алии дрожали руки. Она вышла на сцену, нашла глазами маму в зале и глубоко вдохнула. Первые строчки прозвучали тихо, но потом голос окреп. Алия читала стихотворение о родной степи, и зал слушал не шевелясь.
Она заняла второе место и получила в подарок книгу стихов. Но самой большой наградой для Алии стало то, что она победила свой страх.`,
  q: [['С чем мама сравнила страх?', 'С тенью', 'С туманом', 'С горой'], ['Перед кем Алия репетировала первым?', 'Перед зеркалом', 'Перед бабушкой', 'Перед братом'], ['Какое место заняла Алия?', 'Второе', 'Первое', 'Третье']] },
{ t: 'Летний лагерь', g: 3, th: 'путешествия', x: `Этим летом я впервые поехал в детский лагерь. Он находился в сосновом лесу на берегу озера. Сначала мне было грустно без мамы и папы, и в первый вечер я даже немного поплакал под одеялом.
Но уже на следующий день всё изменилось. Нас разделили на отряды, и в моём отряде оказались весёлые и дружные ребята. Вожатую звали Камила. Она знала множество игр и песен.
Каждый день был наполнен событиями. Утром мы делали зарядку на берегу, потом купались и загорали. Днём ходили в кружки: я выбрал кружок юных натуралистов. Мы изучали растения, наблюдали за муравьями и даже нашли гнездо дятла. Вечерами в лагере проходили дискотеки, конкурсы и спортивные соревнования. Наш отряд победил в эстафете и получил большой торт.
Самым интересным был поход с ночёвкой. Мы шли по лесной тропе, несли рюкзаки и учились ставить палатки. Вечером у костра пели песни, а вожатая рассказывала про созвездия. Я впервые увидел Млечный Путь.
В последний вечер был большой праздничный концерт и прощальный костёр. Мы обменялись адресами и обещали писать друг другу. Домой я вернулся загорелым, повзрослевшим и с кучей новых друзей. Следующим летом я обязательно поеду туда снова.`,
  q: [['Где находился лагерь?', 'В сосновом лесу у озера', 'В горах', 'У моря'], ['Какой кружок выбрал мальчик?', 'Юных натуралистов', 'Рисования', 'Шахматный'], ['Что он впервые увидел в походе?', 'Млечный Путь', 'Медведя', 'Водопад']] },
{ t: 'Гадкий утёнок', g: 3, th: 'сказки', x: `Летом на старой ферме утка высиживала яйца. Один за другим вылупились жёлтые пушистые утята. Последним появился большой серый птенец. Он был совсем не похож на остальных.
«Какой гадкий утёнок!» — закричали обитатели птичьего двора. Утки щипали его, куры клевали, а индюк надувался и громко бормотал. Даже братья и сёстры не хотели с ним играть. Бедный утёнок очень страдал.
Однажды он не выдержал и убежал. Он долго скитался по болотам и лугам. Осенью утёнок увидел в небе прекрасных белых птиц с длинными шеями. Это летели лебеди. Сердце его сжалось от восторга, но он подумал, что такие красавцы никогда не примут его.
Зима была суровой. Утёнок едва не замёрз в проруби, но его спас добрый крестьянин. Он принёс замёрзшую птицу домой и отогрел у печки. Но утёнок испугался детей и снова убежал.
Пришла весна. Утёнок расправил крылья и почувствовал, что они стали сильными. Он подлетел к пруду, где плавали лебеди, и опустил голову, ожидая насмешек. И вдруг увидел в воде своё отражение. Он больше не был серым и нескладным — он стал прекрасным белым лебедем! Лебеди окружили его и ласково гладили клювами.
Эта сказка учит не судить о других по внешности.`,
  q: [['Каким был последний птенец?', 'Большим и серым', 'Маленьким и жёлтым', 'Чёрным'], ['Кто спас утёнка зимой?', 'Крестьянин', 'Лебеди', 'Утка-мама'], ['Чему учит сказка?', 'Не судить по внешности', 'Не убегать из дома', 'Бояться зимы']] },
{ t: 'Дружба с бабушкой соседкой', g: 3, th: 'добрые поступки', x: `В нашем подъезде на третьем этаже живёт бабушка Роза. Ей восемьдесят лет, и она живёт одна. Её дети и внуки работают в другом городе и приезжают только летом.
Раньше я просто здоровался с ней на лестнице. Но однажды зимой я увидел, как бабушка Роза несёт тяжёлые сумки из магазина и часто останавливается. Я предложил помочь. Она очень обрадовалась и пригласила меня на чай.
Квартира бабушки Розы оказалась удивительной. На стенах висели старые фотографии, на полках стояли книги и фарфоровые слоники. Оказалось, что в молодости бабушка Роза была геологом. Она объездила весь Казахстан и даже искала золото в горах Алтая!

{ t: 'Тайна старого маяка', g: 4, th: 'приключения', x: `Каждое лето Тимур с родителями приезжал к бабушке в маленький рыбацкий посёлок на берегу Каспийского моря. На высоком мысу за посёлком стоял старый маяк. Он давно не работал, и местные жители говорили, что ночью в нём иногда мелькает таинственный огонёк.
Однажды вечером Тимур и его новый друг Аскар решили разгадать эту тайну. Они взяли фонарик, бутылку воды и отправились к маяку. Дорога шла по камням вдоль берега. Волны с шумом разбивались о скалы, а над морем кричали чайки.
Дверь маяка оказалась не заперта. Мальчики вошли внутрь и стали подниматься по узкой винтовой лестнице. Ступеньки скрипели под ногами. Сердце у Тимура колотилось так сильно, что, казалось, его стук был слышен на весь маяк.

Оказалось, что это Ахмет-ата, бывший смотритель маяка. Много лет он зажигал здесь огонь, чтобы корабли не разбились о скалы. Когда маяк закрыли, он не смог с ним расстаться. Теперь он приходит сюда по вечерам наблюдать за птицами. Ахмет-ата уже двадцать лет ведёт дневник: записывает, когда прилетают и улетают птицы, какие виды гнездятся на берегу.

  q: [['На берегу какого моря стоял маяк?', 'Каспийского', 'Чёрного', 'Аральского'], ['Кем был Ахмет-ата?', 'Смотрителем маяка', 'Рыбаком', 'Капитаном'], ['Что Ахмет-ата записывал в дневник?', 'Наблюдения за птицами', 'Погоду', 'Названия кораблей'], ['Кого мальчики увидели в подзорную трубу?', 'Фламинго', 'Тюленей', 'Дельфинов']] },
{ t: 'Наша дружная семья', g: 3, th: 'семья', x: `Меня зовут Айдана, мне девять лет. Я хочу рассказать о своей семье. Она у нас большая и очень дружная.
Мой папа работает водителем автобуса. Каждое утро он встаёт раньше всех и везёт людей на работу и в школу. Папа говорит, что его работа очень ответственная, ведь он отвечает за жизнь пассажиров. В выходные папа любит мастерить. Он сделал для нас с братом деревянный домик во дворе и починил бабушкину старую швейную машинку.

  q: [['Кем работает папа Айданы?', 'Водителем автобуса', 'Врачом', 'Строителем'], ['Чем занимается брат Ерасыл?', 'Борьбой', 'Футболом', 'Музыкой'], ['Сколько лет сестрёнке Томирис?', 'Три года', 'Пять лет', 'Год'], ['Что вырастил дедушка?', 'Яблони и абрикосы', 'Розы', 'Картошку']] },
{ t: 'Мудрая черепаха', g: 3, th: 'животные', x: `Степная черепаха — одно из самых удивительных животных Казахстана. Она живёт в степях и полупустынях, где летом очень жарко, а зимой холодно. Как же такое маленькое и медлительное существо выживает в таких суровых условиях?
Главная защита черепахи — её крепкий панцирь. Он состоит из двух частей: верхней выпуклой и нижней плоской. При опасности черепаха прячет внутрь голову, лапы и хвост. Даже хищная птица или лиса не может прокусить такую броню. Панцирь растёт вместе с черепахой всю жизнь. По кольцам на его щитках можно примерно узнать, сколько ей лет.
Год у степной черепахи очень необычный. Весной, когда степь покрывается сочной травой и цветами, черепаха просыпается и выползает из норы. Она много ест: траву, листья, цветы тюльпанов и других растений. Воду черепаха почти не пьёт, ей хватает влаги из сочных растений.
Но весна в степи короткая. Уже в начале лета, когда трава выгорает на солнце, черепаха роет глубокую нору и засыпает. Это называется летней спячкой. А потом, почти без перерыва, наступает зимняя спячка. Получается, что черепаха бодрствует всего три-четыре месяца в году!
Детёныши черепахи вылупляются из яиц, которые мама закапывает в тёплый песок. Маленькие черепашки сразу становятся самостоятельными и сами ищут себе еду. Они очень маленькие, размером с крупную монету, и их панцирь ещё мягкий.
Степные черепахи живут очень долго — до сорока лет и больше. Но сейчас их становится всё меньше. Люди распахивают степи, а некоторые ловят черепах и продают их как домашних животных. Учёные напоминают: если вы встретили черепаху в степи, не забирайте её домой. Полюбуйтесь ею и оставьте на свободе. В природе черепаха проживёт долгую и счастливую жизнь.`,
  q: [['Из скольких частей состоит панцирь?', 'Из двух', 'Из трёх', 'Из одной'], ['Сколько месяцев в году бодрствует черепаха?', 'Три-четыре', 'Восемь', 'Все двенадцать'], ['Что делать, если встретил черепаху в степи?', 'Оставить на свободе', 'Забрать домой', 'Отнести в зоопарк'], ['Где черепаха откладывает яйца?', 'В тёплый песок', 'На дерево', 'В воду']] },
{ t: 'Первая четверть', g: 2, th: 'школа', x: `Первого сентября Максим пошёл во второй класс. Он думал, что второй класс — это легко, ведь он уже умеет читать и писать. Но всё оказалось не так просто.

Дома Максим сидел грустный. Мама спросила, что случилось. Он рассказал ей всё и добавил: «Наверное, я просто не умею учиться». Мама обняла его и сказала: «Никто не рождается умеющим. Всему можно научиться, если делать это понемногу каждый день».
Они вместе составили план. Каждый день после школы Максим отдыхал полчаса, а потом садился за уроки. Сначала он делал самое трудное задание, пока голова свежая. Математику он решал аккуратно и обязательно проверял. Стихи учил по строчке, рассказывая их то маме, то коту Барсику, который внимательно слушал и иногда мурлыкал.

Прошло два месяца. Однажды Айгуль Нурлановна снова дала самостоятельную работу. Максим решал не спеша и всё проверил. Когда учительница вернула тетради, у Максима стояла пятёрка. А на уроке литературы он рассказал стихотворение так выразительно, что весь класс захлопал.
В конце четверти Максим получил грамоту «За старание». Он повесил её над своим столом. Теперь он точно знал, что всему можно научиться, если не сдаваться.`,
  q: [['Сколько ошибок сделал Максим в первой работе?', 'Три', 'Одну', 'Пять'], ['Кому Максим рассказывал стихи?', 'Маме и коту Барсику', 'Брату', 'Бабушке'], ['Про что была книга?', 'Про путешествие на воздушном шаре', 'Про пиратов', 'Про космос'], ['Какую грамоту получил Максим?', '«За старание»', '«Лучший ученик»', '«За победу в олимпиаде»']] },
{ t: 'Зимовье зверей', g: 2, th: 'сказки', x: `Жили-были в одной деревне бык, баран, свинья, петух и гусь. Жили они у старика и старухи. Но однажды услышали они, что хозяева собираются их продать на ярмарке. Решили звери уйти в лес.

Но вот пришла осень. Стало холодно, задули ветры, а потом выпал снег. Бык говорит товарищам: «Надо нам избу построить, а то зимой замёрзнем». Баран отвечает: «У меня тёплая шуба, я и так перезимую». Свинья говорит: «А я в землю зароюсь, мне не холодно». Гусь и петух сказали: «А мы под ёлкой спрячемся, одним крылом подстелемся, другим накроемся».

{ t: 'Путешествие по Казахстану', g: 4, th: 'путешествия', x: `Прошлым летом наша семья отправилась в большое путешествие по Казахстану. Папа сказал: «Чтобы любить свою страну, нужно её увидеть». Мы сели в машину, взяли палатку, карту и отправились в путь.
Сначала мы поехали на юг, в город Туркестан. Это один из самых древних городов нашей страны. Там стоит величественный мавзолей Ходжи Ахмеда Ясави с огромным бирюзовым куполом. Ему больше шестисот лет. Экскурсовод рассказала, что строители эпохи Тамерлана сделали такие прочные стены, что они выдержали многие землетрясения. Внутри мавзолея было прохладно и тихо, а в главном зале стоит огромный бронзовый котёл, в котором раньше готовили угощение для путников.

Следующей остановкой стало озеро Кольсай в горах. Озеро окружают высокие ели, а вода в нём такая чистая, что видно каждый камешек на дне. Мы ночевали в палатке на берегу. Ночью было холодно, но зато звёзды светили так ярко, как никогда в городе. Утром над озером поднимался белый туман, а потом выглянуло солнце, и вода стала изумрудной.

Последним городом нашего путешествия была Астана. Мы поднялись на «Байтерек» и приложили ладони к отпечатку руки на вершине. Говорят, если при этом загадать желание, оно обязательно сбудется. Я загадал, чтобы мы снова отправились в путешествие.

  q: [['С какого города началось путешествие?', 'С Туркестана', 'С Астаны', 'С Алматы'], ['Как называют одну из частей Чарынского каньона?', 'Долиной замков', 'Долиной цветов', 'Долиной великанов'], ['Какой стала вода в озере Кольсай утром?', 'Изумрудной', 'Красной', 'Мутной'], ['Сколько километров проехала семья?', 'Больше пяти тысяч', 'Около тысячи', 'Сто']] },
{ t: 'Новенькая', g: 4, th: 'дружба', x: `В середине учебного года в наш четвёртый «Б» пришла новая девочка. Её звали Мира. Она приехала из маленького посёлка на севере, где в школе училось всего сорок человек. Мира была тихой, носила длинную косу и очень стеснялась. Учительница посадила её за последнюю парту, рядом со мной.
В первые дни Мира почти ни с кем не разговаривала. На переменах она стояла у окна и смотрела на улицу. Некоторые ребята начали над ней посмеиваться. Ерик передразнивал её говор, потому что она произносила некоторые слова немного по-другому. Девочки не звали её играть, а Мира делала вид, что ей всё равно. Но я видел, как однажды она плакала в раздевалке.
Мне стало стыдно. Я ведь тоже молчал и ничего не делал. Вечером я рассказал об этом папе. Папа помолчал и спросил: «А как бы ты себя чувствовал, если бы оказался на её месте?» Я представил, как прихожу в чужую школу, где все друг друга знают, а меня никто. Мне стало очень неуютно.
На следующий день я заговорил с Мирой. Оказалось, что она прекрасно рисует. В её альбоме были нарисованы лошади, степные птицы и северное сияние, которое она видела у себя в посёлке. А ещё Мира знала названия всех созвездий и умела по ним определять стороны света. Её дедушка был охотником и научил её этому.
Я рассказал об этом нашей учительнице, Сауле Каримовне. Она предложила Мире сделать для класса доклад о звёздах. Мира очень волновалась, но согласилась. Она принесла свои рисунки созвездий и рассказала легенды о них. Весь класс слушал затаив дыхание. Даже Ерик поднял руку и спросил, как найти Полярную звезду.
После этого всё изменилось. Девочки стали звать Миру в свои игры. Ерик извинился за то, что передразнивал её. А наш класс решил создать астрономический кружок, и Мира стала в нём главной. По вечерам мы иногда собирались во дворе школы и смотрели на звёзды в бинокль.
Весной в школе проводили конкурс рисунков, и Мира заняла первое место. На награждении она нашла меня глазами и улыбнулась. Теперь мы лучшие друзья. Мы вместе делаем уроки и мечтаем однажды побывать в настоящей обсерватории.
Я понял важную вещь: каждый человек интересен по-своему. Просто иногда нужно сделать первый шаг и протянуть руку тому, кому сейчас трудно.`,

{ t: 'Четыре времени года', g: 3, th: 'времена года', x: `В году четыре времени года: весна, лето, осень и зима. Каждое из них по-своему прекрасно, и у каждого есть свои чудеса.
Весна приходит в марте. Солнце поднимается выше, дни становятся длиннее. Снег темнеет, оседает и тает. По улицам бегут звонкие ручьи, а с крыш свисают сосульки, с которых падает весёлая капель. На проталинах появляются первые цветы — подснежники и мать-и-мачеха. Из тёплых стран возвращаются птицы: сначала грачи, потом скворцы, а за ними ласточки. На деревьях набухают почки, и вскоре лес покрывается нежной зелёной дымкой. Весна — время пробуждения.
Лето — самое тёплое и солнечное время года. Дни длинные, а ночи короткие. В лесу созревают земляника, малина и черника, а на полях колосится пшеница. В небе гремят грозы, после которых появляются радуги. Дети отдыхают на каникулах: купаются в реках и озёрах, ходят в походы, ловят бабочек и загорают. Птицы выводят птенцов и учат их летать. Летом природа щедро дарит людям свои богатства.
Осень начинается в сентябре. Сначала она тёплая и золотая: листья на деревьях становятся жёлтыми, оранжевыми и красными. Такое время называют золотой осенью. Люди собирают урожай в садах и огородах. Потом наступает поздняя осень. Деревья сбрасывают листву, идут холодные дожди, дует пронизывающий ветер. Перелётные птицы улетают на юг, а звери готовятся к зиме: делают запасы, утепляют норы, меняют шубки. Осень — время урожая и подготовки к холодам.
Зима приходит в декабре. Земля покрывается белым снежным одеялом, реки и озёра замерзают. Дни становятся короткими, а ночи — длинными. Медведи и ежи спят, а другие звери оставляют на снегу цепочки следов. К кормушкам прилетают синицы и снегири. Дети катаются на санках, лыжах и коньках, лепят снеговиков и играют в снежки. Самый любимый зимний праздник — Новый год, когда в каждом доме сверкает нарядная ёлка.
Почему же времена года сменяют друг друга? Это происходит потому, что Земля летит вокруг Солнца, и её ось немного наклонена. Поэтому то одно, то другое полушарие получает больше солнечного света и тепла. Путь Земли вокруг Солнца длится целый год. Когда у нас зима, в далёкой Австралии наступает жаркое лето.
Каждое время года нужно для природы. Зимой земля отдыхает под снегом, весной просыпается, летом набирает силу, а осенью дарит плоды. Так из года в год продолжается великий круговорот жизни.`,
  q: [['Какие птицы возвращаются весной первыми?', 'Грачи', 'Ласточки', 'Снегири'], ['Как называют время, когда листья жёлтые и красные?', 'Золотая осень', 'Поздняя осень', 'Бабье лето'], ['Почему сменяются времена года?', 'Земля летит вокруг Солнца с наклонённой осью', 'Солнце гаснет', 'Луна закрывает Солнце'], ['Что делает земля зимой?', 'Отдыхает под снегом', 'Дарит плоды', 'Просыпается']] },
{ t: 'Как Ерлан стал волонтёром', g: 4, th: 'добрые поступки', x: `Ерлан всегда считал, что добрые дела совершают только взрослые. Ему было десять лет, и он думал: «Что я могу сделать? Я ещё маленький». Но одна осенняя история изменила его мнение.
В конце октября в их городе выдалась очень холодная погода. Однажды, возвращаясь из школы, Ерлан увидел объявление на двери приюта для бездомных животных: «Нужна помощь! Приюту не хватает корма, тёплых подстилок и рук, чтобы ухаживать за животными». Ерлан остановился и долго смотрел на это объявление. Через сетку забора на него смотрела худая рыжая собака с грустными глазами.
Вечером он рассказал об этом маме. Мама сказала: «Если хочешь помочь, подумай, что ты можешь сделать сам». Ерлан всю ночь думал. А утром у него появилась идея.
В школе он подошёл к своей учительнице и предложил провести акцию «Тёплый дом». Учительница поддержала его. Ерлан вместе с друзьями нарисовал плакаты и развесил их на каждом этаже. На плакатах было написано, что можно принести в школу корм, старые одеяла, полотенца и игрушки для животных.
Сначала Ерлан боялся, что никто не откликнется. Но уже на следующий день в классе появилась первая коробка. Потом вторая, третья... Ученики приносили пакеты с кормом, старые пледы, миски. Первоклассники нарисовали для приюта открытки. А мама одной девочки, которая работала в магазине, привезла целый мешок корма.
Через две недели ребята собрали больше двадцати коробок. В субботу родители помогли отвезти всё в приют. Работники приюта не могли поверить своим глазам. Директор приюта, пожилая женщина по имени Лариса Петровна, пожала Ерлану руку и сказала: «Ты сделал больше, чем многие взрослые».
Но на этом Ерлан не остановился. Вместе с папой они стали приходить в приют по выходным. Ерлан выгуливал собак, помогал убирать вольеры и мыть миски. Особенно он подружился с той самой рыжей собакой. Её звали Лиса. Ерлан учил её командам, и Лиса становилась всё веселее. Она быстро научилась сидеть, лежать и давать лапу за кусочек сыра.
А зимой случилось чудо: семья Ерлана решила забрать Лису домой. Теперь она живёт у них и каждое утро провожает Ерлана в школу.
Ерлан понял, что не бывает слишком маленьких людей для больших добрых дел. Главное — не проходить мимо и сделать первый шаг. Сейчас в их школе действует настоящий волонтёрский отряд, и Ерлан стал его командиром.`,
  q: [['Где Ерлан увидел объявление?', 'На двери приюта для животных', 'В школе', 'В газете'], ['Как называлась акция?', '«Тёплый дом»', '«Добрые лапы»', '«Помоги другу»'], ['Сколько коробок собрали ребята?', 'Больше двадцати', 'Пять', 'Сто'], ['Как звали рыжую собаку?', 'Лиса', 'Рыжик', 'Белка']] },
{ t: 'Сказка о золотом зёрнышке', g: 3, th: 'сказки', x: `Давным-давно в одной степной деревне жил бедный, но трудолюбивый юноша по имени Нурлан. Жил он вместе со старой матерью в маленьком глиняном домике. Земли у них было совсем немного, а та, что была, плохо родила: летом её сушило жаркое солнце, а дожди выпадали редко.
Однажды весной Нурлан пошёл в горы за хворостом. Устав, он присел отдохнуть у ручья и вдруг увидел, что в воде запуталась маленькая птичка. Она билась и не могла выбраться. Нурлан осторожно достал её, обогрел в ладонях и отпустил. Птичка села на ветку и заговорила человеческим голосом: «Спасибо тебе, добрый человек. За твою доброту я подарю тебе золотое зёрнышко. Посади его, но помни: оно растёт только от честного труда».
Птичка уронила в ладонь Нурлана блестящее зёрнышко и улетела. Юноша вернулся домой и рассказал всё матери. Мать сказала: «Сынок, дело не в волшебстве. Посади зерно и трудись, как прежде».
Нурлан посадил зёрнышко посреди своего поля. Каждый день он вставал до рассвета, носил воду из далёкого ручья, выпалывал сорняки и рыхлил землю. Соседи смеялись: «Зачем столько трудиться ради одного зёрнышка?» Но Нурлан не обращал на них внимания.
Скоро из зёрнышка вырос крепкий золотистый колос. А когда он созрел, в нём оказалось сто зёрен. Нурлан посадил их все. На следующий год у него было целое поле золотой пшеницы. Он делился зерном с бедными соседями и учил их, как ухаживать за землёй.
Об удивительном урожае узнал жадный бай. Он пришёл к Нурлану и потребовал: «Отдай мне волшебное зерно!» Нурлан не стал спорить и дал ему горсть зёрен. Бай посадил их на своём огромном поле, но сам работать не захотел. Он лишь приказывал слугам, а потом и вовсе забыл о посевах. Поле заросло сорняками, и ни одного колоса на нём не выросло.
Разгневанный бай прибежал к Нурлану: «Ты обманул меня! Твоё зерно не волшебное!» Тогда Нурлан ответил: «Волшебство не в зерне, а в труде. Зёрнышко помогает только тем, кто сам не ленится».
С тех пор в деревне стали трудиться все вместе. Люди провели к полям воду из горной реки, посадили сады, и степь вокруг деревни зазеленела. А старики до сих пор рассказывают детям эту сказку, чтобы они знали: настоящее богатство рождается из труда и доброты.`,
  q: [['Кого спас Нурлан?', 'Маленькую птичку', 'Ягнёнка', 'Лисёнка'], ['Сколько зёрен оказалось в колосе?', 'Сто', 'Десять', 'Тысяча'], ['Почему у бая ничего не выросло?', 'Он не трудился сам', 'Зерно было плохим', 'Была засуха'], ['В чём, по словам Нурлана, волшебство?', 'В труде', 'В зерне', 'В птичке']] },
{ t: 'Удивительный мир пчёл', g: 4, th: 'животные', x: `Пчёлы — одни из самых полезных и удивительных насекомых на Земле. Люди наблюдают за ними тысячи лет, но до сих пор открывают в их жизни что-то новое.
Пчёлы живут большими семьями. В одном улье может быть от двадцати до восьмидесяти тысяч пчёл. Во главе семьи стоит матка. Она крупнее остальных и откладывает яйца — до двух тысяч в день! Кроме матки, в семье есть трутни и рабочие пчёлы. Именно рабочие пчёлы выполняют всю работу: строят соты, чистят улей, кормят личинок, охраняют вход и собирают нектар.
Интересно, что у рабочей пчелы за её короткую жизнь меняется множество профессий. Сначала молодая пчела работает уборщицей и чистит ячейки. Потом становится нянькой и кормит личинок. Затем строит соты из воска, который выделяется у неё на брюшке. После этого она охраняет вход в улей. И только в конце жизни пчела становится сборщицей и вылетает за нектаром.
Как пчёлы находят цветы? Когда пчела-разведчица находит богатую цветами поляну, она возвращается в улей и исполняет особый танец. Если цветы близко, она танцует по кругу. Если далеко — бегает восьмёркой и виляет брюшком. По направлению и скорости танца другие пчёлы узнают, куда и как далеко нужно лететь. Учёный, который разгадал язык пчелиного танца, получил за это Нобелевскую премию.
Чтобы собрать одну ложку мёда, пчёлам нужно облететь тысячи цветков. А для килограмма мёда пчелиная семья пролетает расстояние, равное нескольким оборотам вокруг Земли. Принесённый нектар пчёлы перерабатывают, высушивают взмахами крыльев и запечатывают в ячейках сот восковыми крышечками. Такой мёд может храниться очень долго и не портиться много лет.
Но главная польза пчёл даже не в мёде. Перелетая с цветка на цветок, пчёлы переносят пыльцу и опыляют растения. Без пчёл не было бы многих фруктов, овощей и ягод: яблок, вишен, огурцов, тыкв и подсолнечника. Учёные подсчитали, что примерно треть всей нашей еды зависит от работы пчёл и других насекомых-опылителей.
В последние годы пчёл в мире становится меньше. Им вредят ядохимикаты, которыми обрабатывают поля, и исчезновение диких лугов. Поэтому люди во многих странах стараются защитить пчёл: сажают медоносные цветы, создают пасеки в городах и не используют вредные вещества.
Каждый из нас тоже может помочь пчёлам. Можно посадить во дворе цветы, не уничтожать насекомых без причины и рассказать друзьям, как важны эти маленькие труженицы для всей планеты.`,

{ t: 'Один день в старинном ауле', g: 4, th: 'Казахстан', x: `Представь, что ты попал в казахский аул, каким он был сто пятьдесят лет назад. Как жили тогда люди в степи? Давай проведём с ними один день.
Утро в ауле начиналось очень рано, ещё до восхода солнца. Первыми просыпались женщины. Они разжигали огонь в очаге посреди юрты и ставили на треногу большой казан. Затем шли доить кобылиц, коров и овец. Из молока готовили множество продуктов: кумыс, айран, творог, сушёный сыр курт, который мог храниться много месяцев.
Мужчины и юноши тем временем выводили скот на пастбища. Богатство кочевника измерялось количеством скота. Главными животными были лошади, овцы, верблюды и коровы. Казахи переходили с места на место вслед за свежей травой: летом поднимались на горные пастбища — джайляу, а зимой спускались в защищённые от ветров долины.
Юрта была настоящим чудом изобретательности. Её решётчатые стены, купол и войлочное покрытие можно было разобрать за час и погрузить на нескольких верблюдов. Летом в юрте было прохладно, а зимой тепло. Вход всегда делали на юг, в сторону солнца. Внутри всё имело своё место: почётное место — тор — напротив входа предназначалось для старших и гостей. Пол покрывали узорчатыми войлочными коврами — сырмаками и текеметами, которые женщины валяли из овечьей шерсти.
Днём каждый был занят делом. Мастера изготавливали сёдла, сбрую и посуду из дерева и кожи. Женщины ткали, шили одежду, украшали её вышивкой. Дети с малых лет помогали взрослым: мальчики учились ездить верхом и пасти ягнят, девочки — готовить и рукодельничать. В пять-шесть лет казахский ребёнок уже уверенно держался в седле.

Особое значение имело гостеприимство. Любой путник мог зайти в юрту и знал, что его накормят, напоят и уложат спать. Говорили: «Гость — посланник Бога». Для гостя резали барана и готовили бешбармак.

  if ('ЖШЧЩ'.includes(c) && v === 'Э') return false;
  if ('ЧЩ'.includes(c) && v === 'О') return false;

}
const CLUSTERS = { Б: ['БР', 'БЛ'], В: ['ВР', 'ВЛ', 'ВН'], Г: ['ГР', 'ГЛ', 'ГН'], Д: ['ДР', 'ДВ'], З: ['ЗВ', 'ЗН', 'ЗД', 'ЗЛ'], К: ['КР', 'КЛ', 'КН', 'КВ'], М: ['МН'], П: ['ПР', 'ПЛ'], С: ['СТ', 'СК', 'СП', 'СЛ', 'СМ', 'СН', 'СВ'], Т: ['ТР', 'ТВ'], Ф: ['ФР', 'ФЛ'], Х: ['ХР', 'ХЛ'], Ш: ['ШК', 'ШТ'], Ч: ['ЧТ'], Ж: ['ЖД'] };

const SYL_BAD = new Set(['БЛЯ', 'ХЕР', 'ХЕРТ']);
