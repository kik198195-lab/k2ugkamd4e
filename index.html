<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивный тренажёр скорочтения для учеников 1–4 классов">
<title>Читай и догоняй! — тренажёр скорочтения</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;subset=cyrillic&amp;display=swap" rel="stylesheet">
<style>
:root{
  --hl:#ffb703; --hl-text:#1d3557; --ink:#1d3557; --muted:#8a97b0; --done:#6b7a99;
  --blue:#3a86ff; --blue-d:#2160c4; --green:#2ec27e; --green-d:#1e8c59; --orange:#ff8c42; --orange-d:#d9661e;
  --red:#ef476f; --red-d:#b8304f; --purple:#8e5cf7; --purple-d:#6236c4; --yellow:#ffd23f; --yellow-d:#d9a800;
  --card:#ffffff; --panel:rgba(255,255,255,.92); --radius:1.2rem; --fs:1;
  --font:"Nunito","Segoe UI","Trebuchet MS","Helvetica Neue",Arial,sans-serif;
  --read-font:"Nunito","Segoe UI","Trebuchet MS",Arial,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:max(12px,min(1.15vw,2.05vh));-webkit-text-size-adjust:100%}
@media (max-aspect-ratio:1/1){html{font-size:max(12px,min(3.6vw,2vh))}}
body{font-family:var(--font);color:var(--ink);background:#bde0fe;height:100vh;height:100dvh;overflow:hidden;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:1rem;color:inherit}
input,textarea,select{user-select:text;-webkit-user-select:text}
#app{position:relative;width:100%;height:100%;overflow:hidden}

/* ---------- backgrounds ---------- */
.bg-sky{background:linear-gradient(180deg,#a9def9 0%,#e4f6ff 55%,#c7f0bd 100%)}
.bg-meadow{background:linear-gradient(180deg,#d8f3dc 0%,#b7e4c7 60%,#95d5b2 100%)}
.bg-sunny{background:linear-gradient(160deg,#fff3b0 0%,#ffd6a5 60%,#ffadad 100%)}
.bg-candy{background:linear-gradient(160deg,#f1e4ff 0%,#ffd6f0 50%,#cde7ff 100%)}
.bg-plain{background:#f7fbff}
.bg-race{background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.7)),var(--img-finish) center/cover no-repeat}
.bg-book{background:radial-gradient(circle at 20% 10%,#fff8e8,#f3e2c3 70%,#e9d3ab)}
.bg-calm{background:linear-gradient(180deg,#f0f7ff 0%,#f9fbf2 100%)}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:scale(.985);
  transition:opacity .35s ease,transform .35s ease}
.screen.active{opacity:1;pointer-events:auto;transform:none}
.topbar{display:flex;align-items:center;gap:.8rem;padding:.7rem 1.2rem;flex:0 0 auto;min-height:4.2rem;flex-wrap:wrap}
.topbar h2{font-size:1.7rem;font-weight:900;letter-spacing:.02em;text-shadow:0 .12rem 0 #fff,0 .2rem .4rem rgba(0,0,0,.12);margin-right:auto;white-space:nowrap}
.stage{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:0 1.2rem}
.controls{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.45rem;padding:.7rem 1rem .9rem;
  background:rgba(255,255,255,.75);backdrop-filter:blur(6px);box-shadow:0 -.2rem .8rem rgba(0,0,0,.06)}
.paused *, .paused *::after, .paused *::before{animation-play-state:paused!important}

/* ---------- 3D buttons ---------- */
.btn{--c:var(--blue);--cd:var(--blue-d);border:0;cursor:pointer;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 55%),var(--c);
  color:#fff;font-weight:800;font-size:1.05rem;padding:.65rem 1.2rem;border-radius:1rem;box-shadow:0 .3rem 0 var(--cd),0 .45rem .8rem rgba(0,0,0,.15);
  text-shadow:0 .08rem 0 rgba(0,0,0,.2);transition:transform .08s,box-shadow .08s,filter .2s;white-space:nowrap;line-height:1.2;min-height:2.9rem;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(.25rem);box-shadow:0 .05rem 0 var(--cd),0 .2rem .4rem rgba(0,0,0,.15)}
.btn:disabled{filter:grayscale(.7) opacity(.55);cursor:default}
.btn.green{--c:var(--green);--cd:var(--green-d)} .btn.orange{--c:var(--orange);--cd:var(--orange-d)}
.btn.red{--c:var(--red);--cd:var(--red-d)} .btn.purple{--c:var(--purple);--cd:var(--purple-d)}
.btn.yellow{--c:var(--yellow);--cd:var(--yellow-d);color:#5a3b00;text-shadow:none}
.btn.white{--c:#fff;--cd:#c9d6ea;color:var(--ink);text-shadow:none}
.btn.small{font-size:.9rem;padding:.4rem .8rem;min-height:2.3rem;border-radius:.8rem}
.btn.big{font-size:1.4rem;padding:.9rem 2rem;min-height:3.6rem}
.btn.round{width:2.9rem;padding:0}

/* ---------- speed widget ---------- */
.speed{display:flex;align-items:center;gap:.35rem;background:#fff;border-radius:1rem;padding:.3rem .5rem;box-shadow:inset 0 0 0 .15rem #dbe7f7}
.speed .lbl{font-weight:800;font-size:.85rem;color:var(--muted);padding:0 .3rem;line-height:1.1;text-align:center}
.speed input{width:4.6rem;text-align:center;font-weight:900;font-size:1.35rem;border:0;background:#f1f6fd;border-radius:.6rem;padding:.25rem;color:var(--ink)}
.speed select{border:0;background:#f1f6fd;border-radius:.6rem;padding:.4rem;font-weight:700}
.info-chip{background:#fff;border-radius:1rem;padding:.45rem .9rem;font-weight:800;box-shadow:0 .15rem .5rem rgba(0,0,0,.08);white-space:nowrap}
.info-chip b{color:var(--blue)}

/* ---------- panels & forms ---------- */
.panel{background:var(--panel);border-radius:var(--radius);box-shadow:0 .4rem 1.4rem rgba(29,53,87,.12);padding:1rem 1.2rem}
.opts{display:flex;flex-wrap:wrap;gap:.8rem 1.4rem;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:.3rem;font-weight:800;font-size:.9rem;color:#4a5a7a}
.field select,.field input[type=number],.field input[type=text],.field textarea{border:.15rem solid #dbe7f7;border-radius:.7rem;padding:.45rem .6rem;background:#fff;font-weight:700;font-size:1rem;color:var(--ink);min-width:7rem}
.field textarea{min-height:8rem;resize:vertical;font-family:var(--read-font);line-height:1.5}
.check{display:flex;align-items:center;gap:.45rem;font-weight:800;font-size:.95rem;cursor:pointer;color:#4a5a7a}
.check input{width:1.3rem;height:1.3rem;accent-color:var(--green)}
input[type=color]{width:3rem;height:2.3rem;border:0;background:none;cursor:pointer}
input[type=range]{accent-color:var(--blue);width:9rem}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{border:0;cursor:pointer;min-width:2.6rem;height:2.6rem;padding:0 .6rem;border-radius:.7rem;font-weight:900;font-size:1.15rem;background:#eef4fc;color:#7a8bab;
  box-shadow:0 .2rem 0 #cfdbec;transition:.1s}
.chip.on{background:var(--green);color:#fff;box-shadow:0 .2rem 0 var(--green-d)}
.chip.vow.on{background:var(--red);box-shadow:0 .2rem 0 var(--red-d)}
.seg{display:inline-flex;background:#eef4fc;border-radius:.9rem;padding:.2rem;gap:.2rem;flex-wrap:wrap}
.seg button{border:0;background:none;padding:.45rem .8rem;border-radius:.7rem;font-weight:800;cursor:pointer;color:#5b6c8c}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 .15rem .4rem rgba(0,0,0,.12)}
.setup{overflow:auto;padding-bottom:1rem}
.setup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(22rem,1fr));gap:1rem}
.setup h3{font-size:1.15rem;font-weight:900;margin-bottom:.6rem}
.hint{color:var(--muted);font-weight:700;font-size:.85rem}
.collapse-btn{margin-left:auto}
.collapse-btn.on{--c:var(--blue);--cd:var(--blue-d);color:#fff}
.drawer{position:absolute;left:1.2rem;right:1.2rem;bottom:.3rem;z-index:12;max-height:calc(100% - .6rem);overflow:auto;animation:drawerIn .25s ease;border:.2rem solid #fff}
.drawer.closed{display:none}
@keyframes drawerIn{from{opacity:0;transform:translateY(1rem)}}
.topbar .hud{flex:1 1 auto;justify-content:flex-end}

/* ---------- MENU ---------- */
#menu{background:linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.55)),var(--img-finish) center/cover no-repeat}
#menu .menu-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem;padding:1rem;min-height:0}
.title{font-size:4.2rem;font-weight:900;text-align:center;line-height:1.05;color:#fff;letter-spacing:.02em;
  text-shadow:0 .25rem 0 #e85d04,0 .5rem 0 #9d0208,0 .8rem 1.2rem rgba(0,0,0,.25);animation:titleBob 3s ease-in-out infinite}
.title small{display:block;font-size:1.4rem;color:#1d3557;text-shadow:0 .1rem 0 #fff;margin-top:.5rem;letter-spacing:.01em}
@keyframes titleBob{50%{transform:translateY(-.4rem) rotate(-1deg)}}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,15rem));gap:1.1rem;justify-content:center}
.tile{--c:var(--blue);--cd:var(--blue-d);position:relative;border:0;cursor:pointer;border-radius:1.6rem;padding:1.1rem .8rem 1rem;color:#fff;
  background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 50%),var(--c);box-shadow:0 .45rem 0 var(--cd),0 .8rem 1.4rem rgba(0,0,0,.2);
  display:flex;flex-direction:column;align-items:center;gap:.4rem;font-weight:900;font-size:1.25rem;text-shadow:0 .1rem 0 rgba(0,0,0,.25);
  transition:transform .15s;animation:tileIn .6s backwards}
.tile:hover{transform:translateY(-.35rem) scale(1.03)}
.tile:active{transform:translateY(.3rem)}
.tile .ico{font-size:3rem;filter:drop-shadow(0 .2rem .2rem rgba(0,0,0,.2));animation:icoBob 2.4s ease-in-out infinite}
.tile:nth-child(2) .ico{animation-delay:.3s}.tile:nth-child(3) .ico{animation-delay:.6s}.tile:nth-child(4) .ico{animation-delay:.9s}
.tile:nth-child(5) .ico{animation-delay:1.2s}.tile:nth-child(6) .ico{animation-delay:1.5s}.tile:nth-child(7) .ico{animation-delay:1.8s}
.tile .sub{font-size:.8rem;font-weight:700;opacity:.92;text-shadow:none;line-height:1.2}
@keyframes icoBob{50%{transform:translateY(-.35rem) rotate(6deg)}}
@keyframes tileIn{from{opacity:0;transform:translateY(1.5rem) scale(.9)}}
.menu-road{position:relative;height:5.5rem;flex:0 0 auto;background:linear-gradient(#5c677d,#3f4a5f);border-top:.4rem solid #fff;overflow:hidden}
.menu-road::before{content:"";position:absolute;left:0;right:0;top:50%;height:.4rem;margin-top:-.2rem;
  background:repeating-linear-gradient(90deg,#fff 0 3rem,transparent 3rem 6rem)}
.menu-road img{position:absolute;bottom:.4rem;height:4.4rem;animation:drive 9s linear infinite}
.menu-road img.c2{animation-delay:-4.5s;animation-duration:11s}
@keyframes drive{from{left:-12rem}to{left:105%}}
.cloud{position:absolute;background:#fff;border-radius:50%;opacity:.85;filter:blur(1px);animation:cloud 40s linear infinite;pointer-events:none}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:60%;height:120%;left:15%;top:-55%}.cloud::after{width:45%;height:90%;left:50%;top:-35%}
@keyframes cloud{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
.menu-foot{position:absolute;right:1rem;top:.8rem;display:flex;gap:.5rem;z-index:3}

/* ---------- cars ---------- */
.car{display:block;pointer-events:none;will-change:transform}
.car.yellow{filter:drop-shadow(0 .25rem .2rem rgba(0,0,0,.25))}
.car.red{filter:hue-rotate(-48deg) saturate(1.5) drop-shadow(0 .25rem .2rem rgba(0,0,0,.25))}
.car.green{filter:hue-rotate(60deg) saturate(1.2) drop-shadow(0 .25rem .2rem rgba(0,0,0,.25))}
.car.blue{filter:hue-rotate(160deg) saturate(1.3) drop-shadow(0 .25rem .2rem rgba(0,0,0,.25))}
.car.purple{filter:hue-rotate(230deg) saturate(1.2) drop-shadow(0 .25rem .2rem rgba(0,0,0,.25))}
.car.flip{transform:scaleX(-1)}

/* ---------- SYLLABLE RACES ---------- */
.lanes{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:.6rem;padding:.3rem 0}
.lane{position:relative;display:flex;align-items:center;gap:1rem;height:var(--laneH,10rem);padding:.4rem 1rem;flex:0 0 auto;
  background:linear-gradient(180deg,#f8fdff,#d9f2ff);border-radius:calc(var(--laneH)*.22);box-shadow:inset 0 -.25rem 0 rgba(58,134,255,.18),0 .3rem .8rem rgba(0,0,0,.08);
  border:.18rem solid #fff}
.lanes.two-col{display:grid;grid-template-columns:1fr 1fr;align-content:center;column-gap:1rem;row-gap:.6rem}
.lanes.two-col .lane{min-width:0;gap:.5rem;padding:.4rem .6rem}
.lanes.two-col .track{margin:0 calc(var(--laneH)*.3)}
.lane.active{box-shadow:inset 0 -.25rem 0 rgba(58,134,255,.18),0 0 0 .3rem var(--yellow),0 .3rem 1rem rgba(0,0,0,.12)}
.letter{flex:0 0 auto;height:calc(var(--laneH)*.8);min-width:calc(var(--laneH)*.8);padding:0 calc(var(--laneH)*.08);border-radius:calc(var(--laneH)*.18);
  display:flex;align-items:center;justify-content:center;font-family:var(--read-font);font-weight:900;font-size:calc(var(--laneH)*.6);line-height:1;
  background:linear-gradient(180deg,#fff,#eaf3ff);box-shadow:0 calc(var(--laneH)*.04) 0 #b8cce6,0 .3rem .6rem rgba(0,0,0,.12);border:calc(var(--laneH)*.025) solid #cfe0f5}
.letter.cons{color:#1d4ed8}.letter.vow{color:#e11d48}
.letter.mix span.v{color:#e11d48}.letter.mix span.c{color:#1d4ed8}
.track{position:relative;flex:1 1 auto;height:100%;min-width:0;margin:0 calc(var(--laneH)*.42)}
.track svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.track .car{position:absolute;left:0;top:0;height:calc(var(--laneH)*.46);transform-origin:50% 85%;z-index:2}
.syl-pop{position:absolute;left:50%;top:50%;z-index:3;transform:translate(-50%,-50%) scale(.3);opacity:0;font-family:var(--read-font);font-weight:900;
  font-size:calc(var(--laneH)*.62);line-height:1;padding:.08em .3em;border-radius:.25em;background:#fff;color:var(--ink);
  box-shadow:0 .1em 0 #f4a261,0 .15em .4em rgba(0,0,0,.2);border:.05em solid var(--yellow);pointer-events:none;white-space:nowrap;letter-spacing:.03em}
.syl-pop.show{animation:pop .45s cubic-bezier(.3,1.6,.5,1) forwards}
.syl-pop.stay{opacity:1;transform:translate(-50%,-50%) scale(1)}
@keyframes pop{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.history{flex:0 0 auto;min-height:3rem;display:flex;align-items:center;justify-content:center;gap:.4rem;flex-wrap:wrap;padding:.2rem;
  font-family:var(--read-font);font-weight:800;font-size:1.8rem;color:#33507a}
.history span{background:rgba(255,255,255,.85);padding:.05em .4em;border-radius:.4em}
.history span.last{background:var(--yellow);color:#3d2c00}
.history i{font-style:normal;color:#9db0cc}
.big-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:4}

/* ---------- highlight words ---------- */
.hw{position:relative;display:inline-block;white-space:nowrap;--p:0%;text-indent:0}
.hw::after{content:attr(data-t);position:absolute;left:0;top:0;bottom:0;white-space:nowrap;color:var(--hl);background:none;
  clip-path:inset(-.3em calc(100% - var(--p)) -.3em -.1em);pointer-events:none;width:100%}
.hw:not(.cur)::after{content:none}
.hw.done{color:var(--done)}
.hw.cur{z-index:1}
.reading-word{font-family:var(--read-font);font-weight:800}

/* ---------- WORDS ---------- */
.word-one{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.word-card{background:#fff;border-radius:2rem;padding:2rem 3.5rem;box-shadow:0 .6rem 0 #c8d8ef,0 1rem 2rem rgba(0,0,0,.12);border:.3rem solid #fff;
  width:min(96%,90rem);min-height:55%;display:flex;align-items:center;justify-content:center;text-align:center}
.word-card .hw{font-family:var(--read-font);font-weight:800;line-height:1.15;font-size:calc(min(11vw,24vh)*var(--wsize,1));overflow-wrap:anywhere}
@keyframes cardIn{from{opacity:0;transform:translateY(1rem) scale(.95)}}
.word-grid{flex:1;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:1.2rem;min-height:0;padding:1rem 0}
.word-grid .wc{background:#fff;border-radius:1.4rem;padding:.8rem 1.6rem;box-shadow:0 .4rem 0 #c8d8ef,0 .6rem 1rem rgba(0,0,0,.08);animation:cardIn .35s backwards}
.word-grid .wc:nth-child(odd){background:#fffbea}.word-grid .wc:nth-child(3n){background:#eefbf3}
.word-grid .hw{font-family:var(--read-font);font-weight:800;font-size:calc(3.6rem*var(--wsize,1));line-height:1.2}
.word-rows{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.word-rows{padding:.4rem 0 .8rem}
.word-rows .sheet{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;background:#fff;border-radius:1.6rem;padding:1rem 2.4rem;box-shadow:0 .5rem 1.5rem rgba(0,0,0,.1);line-height:1.5}
.word-rows .row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.2em 1em;align-items:center;font-family:var(--read-font);font-weight:800;font-size:calc(min(4.4vw,9vh)*var(--wsize,1)*var(--rowk,1));padding:.05em 0;border-bottom:.08rem dashed #dde7f4}
.word-rows .row .hw{justify-self:start;white-space:nowrap}

/* ---------- TEXTS / BOOK ---------- */
.lib{display:flex;flex-direction:column;gap:.8rem;min-height:0;flex:1}
.lib-list{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.9rem;padding:.3rem .3rem 1rem;align-content:start}
.tcard{background:#fff;border-radius:1.2rem;padding:.9rem 1rem;box-shadow:0 .3rem 0 #e0d2b5,0 .5rem 1rem rgba(0,0,0,.08);cursor:pointer;border:0;text-align:left;
  display:flex;flex-direction:column;gap:.35rem;transition:transform .12s}
.tcard:hover{transform:translateY(-.2rem)}
.tcard h4{font-size:1.1rem;font-weight:900}
.tcard .meta{display:flex;flex-wrap:wrap;gap:.3rem}
.tag{font-size:.75rem;font-weight:800;padding:.15rem .5rem;border-radius:.5rem;background:#eef4fc;color:#4a5a7a}
.tag.g{background:#e3f9ec;color:#1e8c59}.tag.w{background:#fff3d6;color:#9a6700}.tag.d{background:#ffe3ea;color:#b8304f}.tag.own{background:#efe6ff;color:#6236c4}
.tcard p{font-size:.85rem;color:#6b7a99;font-weight:600;line-height:1.35;max-height:2.7em;overflow:hidden}
.book{flex:1;min-height:0;display:flex;justify-content:center;padding:.4rem 0 .8rem}
/* телесуфлёр: максимум 3 крупные строки, текст плавно едет вверх */
.book.prompter{align-items:center}
.book.prompter .page{--pfs:calc(4.4rem*var(--tsize,1));flex:0 0 auto;height:calc(var(--pfs)*var(--lh,1.8)*3 + 2rem);max-height:100%;overflow:hidden;padding:1rem 3.5rem;scroll-behavior:auto}
.book.prompter .page .txt{font-size:var(--pfs)}
.book.prompter .page .txt p{margin-bottom:0}
.book.prompter .page h3{font-size:calc(var(--pfs)*.85);line-height:var(--lh,1.8);height:calc(var(--pfs)*var(--lh,1.8));margin:0;overflow:hidden}
.page{position:relative;width:min(100%,78rem);background:linear-gradient(90deg,#f6ecd6 0,#fffdf6 3%,#fffdf6 97%,#f6ecd6 100%);border-radius:.6rem 1.4rem 1.4rem .6rem;
  box-shadow:0 .2rem 0 #e6d3ad,0 .5rem 0 #d8bf8f,0 1rem 2rem rgba(80,50,10,.25);overflow:auto;padding:2rem 3.5rem 3rem;scroll-behavior:smooth}
.page h3{text-align:center;font-size:calc(3rem*var(--tsize,1));font-weight:900;color:#7c4a03;margin-bottom:.6em;font-family:var(--read-font)}
.page .txt{font-family:var(--read-font);font-size:calc(3.2rem*var(--tsize,1));line-height:var(--lh,1.8);color:#2b2118;font-weight:600}
.page .txt p{text-indent:1.5em;margin-bottom:.35em}
.page .txt .hw,.word-rows .row .hw{line-height:1.25}
.page.clickable .hw{cursor:pointer}.page.clickable .hw:hover{background:#ffe8a3;border-radius:.2em}
.page .hw.stopmark{background:#ffd6e0;border-radius:.2em;box-shadow:0 0 0 .1em #ff8fab}
.result{max-width:52rem;margin:auto;text-align:center;display:flex;flex-direction:column;gap:1rem;align-items:center}
.result .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.8rem;width:100%}
.stat{background:#fff;border-radius:1rem;padding:.8rem;box-shadow:0 .3rem 0 #dbe7f7}
.stat b{display:block;font-size:2rem;color:var(--blue)}
.stat span{font-weight:800;color:#6b7a99;font-size:.9rem}
.quiz{width:100%;display:flex;flex-direction:column;gap:1rem;text-align:left}
.q{background:#fff;border-radius:1rem;padding:1rem;box-shadow:0 .3rem 0 #dbe7f7}
.q h4{font-size:1.3rem;margin-bottom:.6rem}
.q .ans{display:flex;flex-wrap:wrap;gap:.6rem}
.q .ans button{border:0;cursor:pointer;background:#eef4fc;border-radius:.8rem;padding:.6rem 1rem;font-weight:800;font-size:1.1rem;box-shadow:0 .2rem 0 #cfdbec}
.q .ans button.ok{background:#c9f5d9;box-shadow:0 .2rem 0 #2ec27e}
.q .ans button.no{background:#ffe1e8;box-shadow:0 .2rem 0 #ef9aae;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-.3rem)}75%{transform:translateX(.3rem)}}
.q .fb{margin-top:.5rem;font-weight:800;min-height:1.3em}

/* ---------- BLITZ ---------- */
.blitz-stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;perspective:80rem}
.bcard{width:min(94%,90rem);height:min(75%,40rem);display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem 3rem;border-radius:2.4rem;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 40%),var(--bc,#4cc9f0);box-shadow:0 .8rem 0 rgba(0,0,0,.18),0 1.4rem 2.4rem rgba(0,0,0,.18);
  border:.4rem solid #fff}
.bcard .bt{font-family:var(--read-font);font-weight:900;color:#13294b;font-size:calc(8rem*var(--bsize,1));line-height:1.15;text-shadow:0 .15rem 0 rgba(255,255,255,.6)}
.bcard .bt.mid{font-size:calc(5.5rem*var(--bsize,1))}.bcard .bt.long{font-size:calc(3.6rem*var(--bsize,1))}
.bcard.anim-in{animation:flipIn .35s ease-out}
.bcard.anim-out{animation:flipOut .25s ease-in forwards}
@keyframes flipIn{from{opacity:0;transform:rotateY(-70deg) scale(.85)}}
@keyframes flipOut{to{opacity:0;transform:rotateY(70deg) scale(.85)}}
.bar{height:.9rem;background:rgba(255,255,255,.7);border-radius:1rem;overflow:hidden;box-shadow:inset 0 .1rem .2rem rgba(0,0,0,.1);min-width:10rem;flex:1}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),#8be38f);border-radius:1rem;transition:width .2s}
.countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;background:rgba(255,255,255,.55);backdrop-filter:blur(3px)}
.countdown b{font-size:16rem;font-weight:900;color:var(--orange);text-shadow:0 .5rem 0 var(--orange-d),0 1rem 2rem rgba(0,0,0,.2);animation:cd 1s ease-out}
@keyframes cd{from{transform:scale(2);opacity:0}30%{transform:scale(1);opacity:1}to{transform:scale(.9);opacity:.9}}

/* ---------- TOGETHER ---------- */
.hud{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.rest{position:absolute;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;background:rgba(240,247,255,.93)}
.rest .box{background:#fff;border-radius:2rem;padding:2rem 3rem;text-align:center;box-shadow:0 1rem 3rem rgba(0,0,0,.15);display:flex;flex-direction:column;gap:1rem;align-items:center;max-width:92%}
.rest h3{font-size:2.4rem}.rest .big{font-size:5rem;font-weight:900;color:var(--green)}
.breathe{width:7rem;height:7rem;border-radius:50%;background:radial-gradient(circle,#b9fbc0,#72efdd);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.3)}}

/* ---------- CHALLENGE ---------- */
.levels{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:1rem;align-items:center;padding:1rem 0;min-height:0}
.level{border:0;cursor:pointer;border-radius:1.6rem;padding:1.2rem .8rem;background:#fff;box-shadow:0 .5rem 0 #c8d8ef,0 .8rem 1.4rem rgba(0,0,0,.12);
  display:flex;flex-direction:column;align-items:center;gap:.5rem;transition:transform .15s;position:relative}
.level:hover{transform:translateY(-.4rem)}
.level .num{width:3.4rem;height:3.4rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:900;color:#fff;
  background:var(--c);box-shadow:0 .25rem 0 rgba(0,0,0,.2)}
.level .ico{font-size:3.4rem}
.level h4{font-size:1.3rem;font-weight:900}
.level p{font-size:.85rem;color:#6b7a99;font-weight:700;text-align:center}
.stars{font-size:1.6rem;letter-spacing:.1rem;color:#d7deea}
.stars .on{color:#ffc300;text-shadow:0 .1rem 0 #d48806}
.medals{font-weight:800;font-size:.85rem;color:#9a6700}
.race-road{position:relative;height:4.6rem;margin:.4rem 0;background:linear-gradient(#6c757d,#495057);border-radius:1rem;border:.25rem solid #fff;flex:0 0 auto}
.race-road::before{content:"";position:absolute;left:1rem;right:4rem;top:50%;height:.3rem;margin-top:-.15rem;background:repeating-linear-gradient(90deg,#fff 0 2rem,transparent 2rem 4rem)}
.race-road .flag{position:absolute;right:.6rem;top:50%;transform:translateY(-50%);font-size:2.8rem}
.race-road .car{position:absolute;top:50%;height:3.8rem;transform:translate(-50%,-55%);left:3rem;transition:left .3s linear}
.finish{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.45)),var(--img-finish) center/cover;animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0}}
.finish .box{background:rgba(255,255,255,.95);border-radius:2rem;padding:1.6rem 3rem;text-align:center;box-shadow:0 1rem 3rem rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;gap:.7rem;
  animation:boxIn .6s cubic-bezier(.3,1.5,.5,1);max-width:92%}
@keyframes boxIn{from{transform:scale(.5);opacity:0}}
.finish h3{font-size:2.8rem;font-weight:900;color:var(--orange);text-shadow:0 .2rem 0 var(--orange-d)}
.finish .trophy{height:9rem;animation:trophy 1.6s ease-in-out infinite}
@keyframes trophy{50%{transform:translateY(-.5rem) rotate(4deg)}}
.finish .bigstars{font-size:4rem;display:flex;gap:.5rem}
.finish .bigstars span{color:#ffc300;text-shadow:0 .25rem 0 #d48806;animation:starIn .5s backwards}
.finish .bigstars span:nth-child(2){animation-delay:.3s}.finish .bigstars span:nth-child(3){animation-delay:.6s}.finish .bigstars span:nth-child(4){animation-delay:.9s}
@keyframes starIn{from{transform:scale(0) rotate(-180deg);opacity:0}}
.badge{background:linear-gradient(180deg,#fff3c4,#ffd166);border-radius:1rem;padding:.5rem 1.2rem;font-weight:900;color:#7a4d00;box-shadow:0 .25rem 0 #d9a800}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:31}
.confetti i{position:absolute;top:-2rem;width:.8rem;height:1.2rem;border-radius:.2rem;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- SETTINGS / OWN ---------- */
.tabs{display:flex;gap:.4rem;flex-wrap:wrap}
.tabs button{border:0;cursor:pointer;padding:.6rem 1.1rem;border-radius:1rem 1rem 0 0;font-weight:900;background:rgba(255,255,255,.55);color:#4a5a7a}
.tabs button.on{background:#fff;color:var(--blue)}
.tabpane{flex:1;min-height:0;overflow:auto;background:#fff;border-radius:0 1.2rem 1.2rem 1.2rem;padding:1.2rem;margin-bottom:1rem}
.presets{display:flex;flex-wrap:wrap;gap:.4rem}
.own-list{display:flex;flex-direction:column;gap:.6rem;margin-top:1rem}
.own-item{display:flex;gap:.8rem;align-items:center;background:#f6f9fe;border-radius:1rem;padding:.6rem .9rem;flex-wrap:wrap}
.own-item .nm{font-weight:900;flex:1;min-width:10rem}
.own-item .nm small{display:block;font-weight:700;color:var(--muted)}
.carpick{display:flex;gap:.6rem;flex-wrap:wrap}
.carpick button{border:.2rem solid transparent;background:#f1f6fd;border-radius:1rem;padding:.4rem .6rem;cursor:pointer}
.carpick button.on{border-color:var(--green);background:#e3f9ec}
.carpick img{height:3rem}
.bgpick{display:flex;gap:.6rem;flex-wrap:wrap}
.bgpick button{width:5.5rem;height:3.4rem;border-radius:.8rem;border:.25rem solid #fff;cursor:pointer;box-shadow:0 .2rem .5rem rgba(0,0,0,.15);font-weight:800;font-size:.75rem;color:#334}
.bgpick button.on{border-color:var(--green)}
.toast{position:fixed;left:50%;bottom:6rem;transform:translateX(-50%);background:#1d3557;color:#fff;padding:.8rem 1.4rem;border-radius:1rem;font-weight:800;z-index:100;
  animation:fadeIn .3s;box-shadow:0 .5rem 1rem rgba(0,0,0,.25);max-width:90%;text-align:center}
.modal{position:fixed;inset:0;z-index:90;background:rgba(20,30,50,.45);display:flex;align-items:center;justify-content:center;padding:1rem}
.modal .box{background:#fff;border-radius:1.5rem;padding:1.4rem 1.6rem;max-width:56rem;width:100%;max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:.8rem;animation:boxIn .3s}
.modal h3{font-size:1.4rem}
.row-btns{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:2rem;text-align:center;color:var(--muted);font-weight:800}
.qedit{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:.4rem;align-items:center}
.qedit input{border:.12rem solid #dbe7f7;border-radius:.5rem;padding:.35rem;font-weight:700;min-width:0}

/* ---------- responsive ---------- */
@media (max-width:1000px){
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .levels{grid-template-columns:repeat(3,1fr);overflow:auto;align-content:start}
}
@media (max-width:640px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
  .tile{font-size:1.05rem;padding:.8rem .5rem}.tile .ico{font-size:2.3rem}
  .title{font-size:2.6rem}.title small{font-size:1rem}
  .levels{grid-template-columns:repeat(2,1fr)}
  .page{padding:1.2rem 1.2rem 2rem}
  .word-card{padding:1.2rem 1.4rem}
  .lane{gap:.4rem;padding:.3rem .5rem}
  .topbar h2{font-size:1.3rem}
  .setup-grid{grid-template-columns:1fr}
  .qedit{grid-template-columns:1fr 1fr}
  .speed input{width:3.8rem}
  .bcard{padding:1.2rem 1rem;min-width:80%}
  .bcard .bt{font-size:calc(4.6rem*var(--bsize,1))}.bcard .bt.mid{font-size:calc(3.2rem*var(--bsize,1))}.bcard .bt.long{font-size:calc(2.2rem*var(--bsize,1))}
  .word-card .hw{font-size:calc(3.6rem*var(--wsize,1))}
  .word-grid .hw{font-size:calc(2.2rem*var(--wsize,1))}
  .word-rows .row{font-size:calc(1.7rem*var(--wsize,1))}
  .page h3,.page .txt{font-size:calc(1.5rem*var(--tsize,1))}
  .controls .btn.big{font-size:1.05rem;padding:.6rem 1rem;min-height:2.8rem}
}
.bcard .bt{overflow-wrap:anywhere}
@media (max-height:520px){ .menu-road{height:3.5rem}.menu-road img{height:2.8rem}.tile .ico{font-size:2rem}.title{font-size:2.6rem}}

</style>
